function field(label,value,onChange,type="text",placeholder=""){

// Select builder helper
function selectField(label,value,onChange,options){

      h(FField,{label:"Description"},inp({style:S.inp,value:form.description||"",onChange:e=>F("description")(e.target.value)})),
      div({style:{height:10}}),
      h(SectionLabel,{c:C.primary},"📋 Champs"),
      div({style:{background:"#f8fafc",borderRadius:10,padding:12,marginBottom:10}},
        h(FG2,null,
          h(FField,{label:"Nom du Champ"},inp({style:S.inp,value:champF.label,onChange:e=>setChampF(f=>({...f,label:e.target.value}))})),
          h(FField,{label:"Type"},sel({style:S.inp,value:champF.type,onChange:e=>setChampF(f=>({...f,type:e.target.value}))},h("option",{value:"text"},"Texte"),h("option",{value:"number"},"Nombre"),h("option",{value:"date"},"Date")))
        ),
        btn({style:{...S.bp,fontSize:12},onClick:()=>{if(!champF.label)return;setForm(f=>({...f,champs:[...f.champs,{id:gid("cf"),label:champF.label,type:champF.type}]}));setChampF({label:"",type:"text"});}},"+ Ajouter Champ")
      ),
      ...form.champs.map((c,i)=>div({key:c.id,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"#f0f9ff",borderRadius:8,marginBottom:6}},
        span({style:{fontSize:13}},h("b",null,c.label)," ",span({style:{color:C.textL}},"(",c.type,")")),
        btn({style:{...S.bid,padding:"3px 8px",fontSize:12},onClick:()=>setForm(f=>({...f,champs:f.champs.filter((_,j)=>j!==i)}))},"\u2715")
      ))
    ),
    delId&&h(ConfirmDel,{onConfirm:()=>{mutate(d=>{d.modules=d.modules.filter(m=>m.id!==delId);return d;});showAlert("Module supprimé","warning");setDelId(null);},onCancel:()=>setDelId(null),item:"ce module personnalisé"}),
    div({style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:12}},
      ...(data.modules||[]).map(m=>div({key:m.id,style:{...S.card,borderTop:`4px solid ${C.primary}`}},
        div({style:{fontSize:26,marginBottom:5}},m.icon),
        div({style:{fontWeight:800,fontSize:14}},m.nom),
        div({style:{fontSize:12,color:C.textM,marginBottom:7}},m.description),
        div({style:{fontSize:11,color:C.textL,marginBottom:10}},(m.champs||[]).length+" champs · "+(m.enregistrements||[]).length+" enregistrements"),
        btn({style:{...S.bid,fontSize:12},onClick:()=>setDelId(m.id)},"🗑️ Supprimer")
      )),
      !(data.modules||[]).length&&div({style:{...S.card,textAlign:"center",color:C.textL,gridColumn:"1/-1",padding:40}},"🧩 Aucun module créé.")
    )
  );
}

function ExtView({module:m}){return div(null,h("h2",{style:{fontSize:18,fontWeight:800,margin:"0 0 12px"}},m.icon," ",m.nom),h(InfoBox,{c:"#eef2ff"},"Module personnalisé — ",(m.champs||[]).length," champs · Gérez via ⚙️ Extensions"));}

// ── PARAMÈTRES ──
function Parametres({session,data,mutate,showAlert,onClose,setSession}){
  const[tab,setTab]=useState("profil");
  const[nom,setNom]=useState(session.nom);const[username,setUsername]=useState(session.username);
  const[oldPwd,setOldPwd]=useState("");const[newPwd,setNewPwd]=useState("");const[confPwd,setConfPwd]=useState("");
  const[editUser,setEditUser]=useState(null);const[euNom,setEuNom]=useState("");const[euUser,setEuUser]=useState("");const[euPwd,setEuPwd]=useState("");const[euRole,setEuRole]=useState("agent");
  const tbStyle=(t)=>({padding:"9px 14px",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,borderBottom:tab===t?`2px solid ${C.primary}`:"2px solid transparent",color:tab===t?C.primary:C.textM,background:"transparent"});
  return div({style:S.modal},div({style:{...S.mbox,maxWidth:480}},
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("h3",{style:{...S.mtitle,margin:0}},"⚙️ Paramètres"),
      btn({style:{background:"transparent",border:"none",fontSize:20,cursor:"pointer",color:C.textM},onClick:onClose},"\u2715")
    ),
    div({style:{display:"flex",borderBottom:`1px solid ${C.border}`,marginBottom:16}},
      btn({style:tbStyle("profil"),onClick:()=>setTab("profil")},"👤 Profil"),
      btn({style:tbStyle("pwd"),onClick:()=>setTab("pwd")},"🔑 Mot de passe"),
      session.role==="superadmin"&&btn({style:tbStyle("users"),onClick:()=>setTab("users")},"👥 Utilisateurs")
    ),
    tab==="profil"&&div(null,
      div({style:{marginBottom:11}},h("label",{style:S.lbl},"Nom complet"),inp({style:S.inp,value:nom,onChange:e=>setNom(e.target.value)})),
      div({style:{marginBottom:11}},h("label",{style:S.lbl},"Nom d'utilisateur"),inp({style:S.inp,value:username,onChange:e=>setUsername(e.target.value)})),
      h(InfoBox,{c:"#f8fafc"},"Rôle : ",h("b",{style:{color:C.primary}},session.role==="superadmin"?"Super Admin":"Agent")),
      div({style:{height:10}}),
      btn({style:S.bp,onClick:()=>{if(!nom||!username){showAlert("Requis","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,nom,username}:u);return d;});setSession(s=>({...s,nom,username}));showAlert("Profil mis à jour ✓","success");}},"💾 Enregistrer")
    ),
    tab==="pwd"&&div(null,
      div({style:{marginBottom:11}},h("label",{style:S.lbl},"Ancien mot de passe"),inp({style:S.inp,type:"password",value:oldPwd,onChange:e=>setOldPwd(e.target.value)})),
      div({style:{marginBottom:11}},h("label",{style:S.lbl},"Nouveau mot de passe"),inp({style:S.inp,type:"password",value:newPwd,onChange:e=>setNewPwd(e.target.value)})),
      div({style:{marginBottom:11}},h("label",{style:S.lbl},"Confirmer"),inp({style:S.inp,type:"password",value:confPwd,onChange:e=>setConfPwd(e.target.value)})),
      newPwd&&confPwd&&newPwd!==confPwd&&span({style:{color:C.danger,fontSize:12,display:"block",marginBottom:8}},"⚠ Ne correspondent pas"),
      btn({style:S.bp,onClick:()=>{const usr=data.users.find(u=>u.id===session.id);if(usr.password!==oldPwd){showAlert("Mot de passe incorrect","error");return;}if(newPwd.length<6){showAlert("Min 6 caractères","error");return;}if(newPwd!==confPwd){showAlert("Ne correspondent pas","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,password:newPwd}:u);return d;});setOldPwd("");setNewPwd("");setConfPwd("");showAlert("Mot de passe modifié ✓","success");}},"🔑 Changer")
    ),
    tab==="users"&&session.role==="superadmin"&&div(null,
      editUser?div(null,
        div({style:{fontWeight:700,color:C.primary,marginBottom:10,fontSize:13}},"✏️ ",editUser.nom),
        h(FG2,null,
          h(FField,{label:"Nom"},inp({style:S.inp,value:euNom,onChange:e=>setEuNom(e.target.value)})),
          h(FField,{label:"Username"},inp({style:S.inp,value:euUser,onChange:e=>setEuUser(e.target.value)})),
          h(FField,{label:"Nouveau mot de passe (optionnel)"},inp({style:S.inp,type:"password",value:euPwd,onChange:e=>setEuPwd(e.target.value)})),
          h(FField,{label:"Rôle"},sel({style:S.inp,value:euRole,onChange:e=>setEuRole(e.target.value)},h("option",{value:"agent"},"Agent"),h("option",{value:"superadmin"},"Super Admin")))
        ),
        div({style:{display:"flex",gap:10}},btn({style:S.bs,onClick:()=>setEditUser(null)},"Annuler"),btn({style:S.bp,onClick:()=>{mutate(d=>{d.users=d.users.map(u=>u.id===editUser.id?{...u,nom:euNom,username:euUser,role:euRole,...(euPwd?{password:euPwd}:{})}:u);return d;});showAlert("Modifié ✓","success");setEditUser(null);}},"💾 Enregistrer"))
      ):div(null,...data.users.map(u=>div({key:u.id,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 11px",borderRadius:9,background:"#f8fafc",marginBottom:7}},
        div(null,div({style:{fontWeight:700,fontSize:13}},u.nom),div({style:{fontSize:11,color:C.textM}},"@",u.username," · ",u.role==="superadmin"?"Super Admin":"Agent"," · ",span({style:{color:u.actif?"#22c55e":C.danger}},u.actif?"Actif":"Inactif"))),
        div({style:{display:"flex",gap:5}},
          btn({style:S.bie,onClick:()=>{setEditUser(u);setEuNom(u.nom);setEuUser(u.username);setEuPwd("");setEuRole(u.role);}},"✏️"),
          btn({style:{...S.bie,background:u.actif?"#fef2f2":"#f0fdf4"},onClick:()=>mutate(d=>{d.users=d.users.map(x=>x.id===u.id?{...x,actif:!x.actif}:x);return d;})},u.actif?"🔒":"🔓")
        )
      )))
    ),
    div({style:S.mact},btn({style:S.bs,onClick:onClose},"Fermer"))
  ));
}

// ── RENDER ──
ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
