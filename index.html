// ── DASHBOARD ──
function Dashboard({data,setPage}){
  const today=tod();
  const contratsA=data.contrats.filter(c=>c.statut==="actif");
  const txToday=data.transactions.filter(t=>t.date===today);
  const totalTxToday=txToday.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  const totalEnc=data.transactions.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  const totalVentes=data.ventes.reduce((s,v)=>s+Number(v.total||0),0);
  const ventesToday=data.ventes.filter(v=>v.date===today).reduce((s,v)=>s+Number(v.total||0),0);
  const totalInvest=data.investissements.reduce((s,i)=>s+Number(i.montant||0),0);
  const profitCommerce=data.ventes.reduce((s,v)=>s+Number(v.profitNet||0),0);
  const stockAlerts=data.produits.filter(p=>Number(p.stockUnites||0)<=Number(p.minStockAlert||0));
  const alertEch=data.contrats.filter(c=>{if(c.statut!=="actif")return false;const j=daysBetween(today,c.dateFin);return j>=0&&j<=30;});
  const clientsDus=data.clients.filter(c=>Number(c.balanceDue||0)>0);
  const cards=[
    {g:"taxi",l:"Motos",v:data.motos.length,ic:"🏍️",sub:`${contratsA.length} contrats actifs`,p:"motos"},
    {g:"taxi",l:"Encaissé Aujourd'hui",v:`${fmt(totalTxToday)} HTG`,ic:"💳",sub:`${txToday.length} paiements`,p:"transactions"},
    {g:"commerce",l:"Ventes Aujourd'hui",v:`${fmt(ventesToday)} HTG`,ic:"🧾",sub:`${data.ventes.filter(v=>v.date===today).length} factures`,p:"ventes"},
    {g:"commerce",l:"Profit Commerce",v:`${fmt(profitCommerce)} HTG`,ic:"📈",sub:`CA: ${fmt(totalVentes)} HTG`,p:"rapports"},
    {g:"gestion",l:"Investissements",v:`${fmt(totalInvest)} HTG`,ic:"💼",sub:`${data.investissements.length} enregistrements`,p:"investissements"},
    {g:"taxi",l:"Total Taxi Encaissé",v:`${fmt(totalEnc)} HTG`,ic:"💰",sub:`${data.chauffeurs.length} chauffeurs`,p:"caisse"},
    {g:"commerce",l:"Produits en Stock",v:data.produits.length,ic:"📦",sub:`${stockAlerts.length} alertes stock`,p:"inventaire"},
    {g:"commerce",l:"Clients",v:data.clients.length,ic:"👥",sub:`${clientsDus.length} balances dues`,p:"clients"},
  ];
  return(<div>
    <div style={{marginBottom:12}}><h2 style={{fontSize:18,fontWeight:800,color:C.text,margin:"0 0 2px"}}>📊 Tableau de Bord</h2><div style={{fontSize:12,color:C.textM}}>📅 {new Date().toLocaleDateString("fr",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:11,marginBottom:12}}>
      {cards.map((c,i)=>{const col=MC[c.g]||C.primary;return(<div key={i} onClick={()=>setPage(c.p)} style={{...S.card,borderLeft:`4px solid ${col}`,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={{fontSize:11,color:C.textM,fontWeight:600}}>{c.l}</div><div style={{fontSize:17,fontWeight:800,color:C.text,margin:"3px 0"}}>{c.v}</div><div style={{fontSize:10,color:C.textL}}>{c.sub}</div></div><span style={{fontSize:22}}>{c.ic}</span></div>
      </div>);})}
    </div>
    {(alertEch.length>0||stockAlerts.length>0||clientsDus.length>0)&&(<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:11,marginBottom:12}}>
      {alertEch.length>0&&(<div style={{...S.card,borderLeft:`4px solid ${C.taxi}`}}><div style={{fontWeight:700,color:C.taxi,fontSize:13,marginBottom:7}}>⏰ Contrats Proches ({alertEch.length})</div>{alertEch.slice(0,4).map(c=>{const ch=data.chauffeurs.find(x=>x.id===c.chauffeurId);return(<div key={c.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>👤 {ch?.nom} {ch?.prenom} — <b>{daysBetween(today,c.dateFin)}j</b></div>);})}</div>)}
      {stockAlerts.length>0&&(<div style={{...S.card,borderLeft:`4px solid ${C.commerce}`}}><div style={{fontWeight:700,color:C.commerce,fontSize:13,marginBottom:7}}>📦 Stock Faible ({stockAlerts.length})</div>{stockAlerts.slice(0,4).map(p=>(<div key={p.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>📦 {p.nom} — <b style={{color:C.danger}}>{p.stockUnites||0} u.</b></div>))}</div>)}
      {clientsDus.length>0&&(<div style={{...S.card,borderLeft:`4px solid ${C.danger}`}}><div style={{fontWeight:700,color:C.danger,fontSize:13,marginBottom:7}}>💰 Balances Dues ({clientsDus.length})</div>{clientsDus.slice(0,4).map(c=>(<div key={c.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>👥 {c.nom} — <b style={{color:C.danger}}>{fmt(c.balanceDue)} HTG</b></div>))}</div>)}
    </div>)}
    <div style={S.card}><div style={{fontWeight:700,color:C.text,fontSize:13,marginBottom:9}}>🧾 Dernières Ventes</div><div style={{overflowX:"auto"}}><table style={S.table}><thead><tr><th style={S.th}>Date</th><th style={S.th}>Client</th><th style={S.th}>Total</th><th style={S.th}>Profit</th><th style={S.th}>Statut</th></tr></thead><tbody>{data.ventes.slice(-6).reverse().map(v=>(<tr key={v.id}><td style={S.td}>{v.date}</td><td style={S.td}>{v.clientNom||"—"}</td><td style={{...S.td,fontWeight:700,color:C.commerce}}>{fmt(v.total)} HTG</td><td style={{...S.td,color:"#10b981"}}>{fmt(v.profitNet)} HTG</td><td style={S.td}><SBadge s={v.statutPaiement||"Payé"}/></td></tr>))}{!data.ventes.length&&<EmptyRow cols={5}/>}</tbody></table></div></div>
  </div>);
}
// ── MOTOS ──
function GMotos({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);const[editing,setEditing]=useState(null);const[search,setSearch]=useState("");const[delId,setDelId]=useState(null);
  const em=()=>({code:"",type:"2 roues",marque:"",modele:"",annee:"",couleur:"",etat:"neuve",numeroMoteur:"",numeroChassis:"",numeroImmat:"",prixAchat:"",dateAchat:"",fraisTransport:"",fraisDedouanement:"",fraisLegalisation:"",fraisImmatriculation:"",autresFrais:"",numeroAssurance:"",dateExpAssurance:"",kilometrage:"",statut:"disponible",description:""});
  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const coutT=(m)=>[m.prixAchat,m.fraisTransport,m.fraisDedouanement,m.fraisLegalisation,m.fraisImmatriculation,m.autresFrais].reduce((s,v)=>s+Number(v||0),0);
  const save_=()=>{if(!form.marque||!form.modele){showAlert("Marque et modèle requis","error");return;}mutate(d=>{if(editing)d.motos=d.motos.map(m=>m.id===editing?{...form,id:editing}:m);else d.motos=[...d.motos,{...form,id:gid("moto"),dateCreation:tod()}];showAlert(editing?"Moto modifiée ✓":"Moto ajoutée ✓","success");return d;});setShowF(false);setEditing(null);setForm(em());};
  const del_=(id)=>{mutate(d=>{d.motos=d.motos.filter(m=>m.id!==id);return d;});showAlert("Moto supprimée","warning");setDelId(null);};
  const filtered=data.motos.filter(m=>`${m.marque}${m.modele}${m.code}${m.numeroImmat}`.toLowerCase().includes(search.toLowerCase()));
  return(<div>
    <PageHeader title="🏍️ Motos" color={C.taxi} onAdd={()=>{setForm(em());setEditing(null);setShowF(true);}} label="+ Moto"/>
    <input style={{...S.inp,maxWidth:280,marginBottom:12}} placeholder="🔍 Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
    {showF&&<Modal title={editing?"✏️ Modifier Moto":"➕ Nouvelle Moto"} onClose={()=>{setShowF(false);setEditing(null);}} onSave={save_} saveColor={C.taxi}>
      <FG2>{[["code","Code"],["marque","Marque *"],["modele","Modèle *"],["annee","Année"],["couleur","Couleur"],["numeroMoteur","N° Moteur"],["numeroChassis","N° Châssis"],["numeroImmat","N° Immatriculation"],["prixAchat","Prix Achat (HTG)","number"],["dateAchat","Date Achat","date"],["fraisTransport","Frais Transport","number"],["fraisDedouanement","Frais Dédouanement","number"],["fraisLegalisation","Frais Légalisation","number"],["fraisImmatriculation","Frais Immatriculation","number"],["autresFrais","Autres Frais","number"],["numeroAssurance","N° Assurance"],["dateExpAssurance","Exp. Assurance","date"],["kilometrage","Kilométrage","number"]].map(([k,l,t])=>(<FField key={k} label={l}><input style={S.inp} type={t||"text"} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>))}
      <FField label="Type"><select style={S.inp} value={form.type} onChange={e=>F("type",e.target.value)}><option>2 roues</option><option>3 roues</option></select></FField>
      <FField label="État"><select style={S.inp} value={form.etat} onChange={e=>F("etat",e.target.value)}><option>neuve</option><option>usagée</option></select></FField>
      <FField label="Statut"><select style={S.inp} value={form.statut} onChange={e=>F("statut",e.target.value)}><option>disponible</option><option>attribuée</option><option>en maintenance</option></select></FField>
      </FG2>
      <FField label="Description" full><textarea style={{...S.inp,height:55,resize:"vertical"}} value={form.description||""} onChange={e=>F("description",e.target.value)}/></FField>
    </Modal>}
    {delId&&<ConfirmDel onConfirm={()=>del_(delId)} onCancel={()=>setDelId(null)} item={`Moto: ${data.motos.find(m=>m.id===delId)?.marque} ${data.motos.find(m=>m.id===delId)?.modele}`}/>}
    <div style={{...S.card,overflowX:"auto"}}><table style={S.table}><thead><tr>{["Code","Type","Marque/Modèle","Immat.","État","Statut","Coût Total","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
      {filtered.map(m=>(<tr key={m.id}><td style={S.td}><span style={{...S.badge,background:"#f1f5f9",color:C.textM}}>{m.code||"—"}</span></td><td style={S.td}><span style={{...S.badge,background:m.type==="2 roues"?"#dbeafe":"#fef3c7",color:m.type==="2 roues"?"#1d4ed8":"#92400e"}}>{m.type}</span></td><td style={S.td}><b>{m.marque}</b> {m.modele} <span style={{color:C.textL}}>{m.annee}</span></td><td style={S.td}>{m.numeroImmat||"—"}</td><td style={S.td}><span style={{color:m.etat==="neuve"?"#22c55e":C.taxi}}>● {m.etat}</span></td><td style={S.td}><SBadge s={m.statut}/></td><td style={{...S.td,fontWeight:700}}>{fmt(coutT(m))} HTG</td><td style={S.td}><RowActions onEdit={()=>{setForm(m);setEditing(m.id);setShowF(true);}} onDel={session.role==="superadmin"?()=>setDelId(m.id):null}/></td></tr>))}
      {!filtered.length&&<EmptyRow cols={8}/>}
    </tbody></table></div>
  </div>);
}
// ── CHAUFFEURS ──
function GChauffeurs({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);const[editing,setEditing]=useState(null);const[search,setSearch]=useState("");const[detteId,setDetteId]=useState(null);const[delId,setDelId]=useState(null);
  const em=()=>({code:"",nom:"",prenom:"",sexe:"Masculin",dateNaissance:"",cin:"",telephone:"",whatsapp:"",adresse:"",permis:"",categoriePermis:"",dateExpPermis:"",experience:"",temoinNom:"",temoinTel:"",temoinAdresse:"",temoinRelation:"",temoinCin:"",changementCouleur:"",remplacementMoteur:"",autresModifications:"",statut:"actif"});
  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const calcDette=(ch)=>{const ct=data.contrats.find(c=>c.chauffeurId===ch.id&&c.statut==="actif");if(!ct)return null;const jA=Math.max(0,daysBetween(ct.dateDebut,tod())+1);const txs=data.transactions.filter(t=>t.contratId===ct.id);const totalP=txs.reduce((s,t)=>s+Number(t.montantPaye||0),0);const attendu=jA*Number(ct.montantJournalier||0);return{ct,totalP,attendu,dette:Math.max(0,attendu-totalP),nbP:txs.length};};
  const save_=()=>{if(!form.nom||!form.prenom){showAlert("Nom et prénom requis","error");return;}mutate(d=>{if(editing)d.chauffeurs=d.chauffeurs.map(c=>c.id===editing?{...form,id:editing}:c);else d.chauffeurs=[...d.chauffeurs,{...form,id:gid("ch"),dateCreation:tod()}];showAlert(editing?"Modifié ✓":"Ajouté ✓","success");return d;});setShowF(false);setEditing(null);setForm(em());};
  const del_=(id)=>{mutate(d=>{d.chauffeurs=d.chauffeurs.filter(c=>c.id!==id);return d;});showAlert("Chauffeur supprimé","warning");setDelId(null);};
  const filtered=data.chauffeurs.filter(c=>`${c.nom}${c.prenom}${c.cin}${c.telephone}`.toLowerCase().includes(search.toLowerCase()));
  return(<div>
    <PageHeader title="👤 Chauffeurs" color={C.taxi} onAdd={()=>{setForm(em());setEditing(null);setShowF(true);}} label="+ Chauffeur"/>
    <input style={{...S.inp,maxWidth:280,marginBottom:12}} placeholder="🔍 Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
    {showF&&<Modal title={editing?"✏️ Modifier":"➕ Nouveau Chauffeur"} onClose={()=>{setShowF(false);setEditing(null);}} onSave={save_} saveColor={C.taxi}>
      <SectionLabel c={C.taxi}>📋 Informations Personnelles</SectionLabel>
      <FG2>{[["code","Code"],["nom","Nom *"],["prenom","Prénom *"],["cin","CIN/NIF"],["telephone","Téléphone"],["whatsapp","WhatsApp"],["adresse","Adresse"],["dateNaissance","Date Naissance","date"],["permis","N° Permis"],["categoriePermis","Catégorie Permis"],["dateExpPermis","Exp. Permis","date"],["experience","Expérience"]].map(([k,l,t])=>(<FField key={k} label={l}><input style={S.inp} type={t||"text"} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>))}
      <FField label="Sexe"><select style={S.inp} value={form.sexe} onChange={e=>F("sexe",e.target.value)}><option>Masculin</option><option>Féminin</option></select></FField>
      <FField label="Statut"><select style={S.inp} value={form.statut} onChange={e=>F("statut",e.target.value)}><option>actif</option><option>suspendu</option><option>inactif</option></select></FField>
      </FG2>
      <SectionLabel c={C.taxi}>👥 Témoin</SectionLabel>
      <FG2>{[["temoinNom","Nom"],["temoinTel","Téléphone"],["temoinAdresse","Adresse"],["temoinRelation","Relation"],["temoinCin","CIN"]].map(([k,l])=>(<FField key={k} label={l}><input style={S.inp} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>))}</FG2>
      <SectionLabel c={C.taxi}>🔧 Modifications Moto</SectionLabel>
      <FG2>{[["changementCouleur","Couleur"],["remplacementMoteur","Moteur"],["autresModifications","Autres"]].map(([k,l])=>(<FField key={k} label={l}><input style={S.inp} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>))}</FG2>
    </Modal>}
    {delId&&<ConfirmDel onConfirm={()=>del_(delId)} onCancel={()=>setDelId(null)} item={`Chauffeur: ${data.chauffeurs.find(c=>c.id===delId)?.nom} ${data.chauffeurs.find(c=>c.id===delId)?.prenom}`}/>}
    {detteId&&(()=>{const ch=data.chauffeurs.find(c=>c.id===detteId);const info=calcDette(ch);return(<div style={S.modal}><div style={{...S.mbox,maxWidth:400}}><h3 style={S.mtitle}>💰 Dette — {ch?.nom} {ch?.prenom}</h3>{!info?<p style={{color:C.textL}}>Aucun contrat actif.</p>:(<div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{[["Attendu",`${fmt(info.attendu)} HTG`],["Payé",`${fmt(info.totalP)} HTG`],["Dette",`${fmt(info.dette)} HTG`],["Paiements",`${info.nbP} jours`],["Fin contrat",info.ct.dateFin],["Journalier",`${fmt(info.ct.montantJournalier)} HTG`]].map(([l,v])=>(<div key={l} style={{background:"#f8fafc",padding:"8px 11px",borderRadius:8}}><div style={{fontSize:11,color:C.textM}}>{l}</div><div style={{fontSize:14,fontWeight:700}}>{v}</div></div>))}</div>{info.dette>0&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:10,color:C.danger,fontWeight:700,marginTop:10}}>⚠️ Dette : {fmt(info.dette)} HTG</div>}</div>)}<div style={S.mact}><button style={S.bs} onClick={()=>setDetteId(null)}>Fermer</button></div></div></div>);})()}
    <div style={{...S.card,overflowX:"auto"}}><table style={S.table}><thead><tr>{["Code","Nom Complet","Téléphone","CIN","Statut","Dette","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead><tbody>
      {filtered.map(c=>{const info=calcDette(c);return(<tr key={c.id}><td style={S.td}><span style={{...S.badge,background:"#f1f5f9",color:C.textM}}>{c.code||"—"}</span></td><td style={S.td}><b>{c.nom} {c.prenom}</b></td><td style={S.td}>{c.telephone||"—"}</td><td style={S.td}>{c.cin||"—"}</td><td style={S.td}><SBadge s={c.statut}/></td><td style={S.td}>{info?<span style={{color:info.dette>0?C.danger:"#22c55e",fontWeight:700}}>{fmt(info.dette)} HTG</span>:"—"}</td><td style={S.td}><div style={{display:"flex",gap:5}}><button style={S.bie} onClick={()=>{setForm(c);setEditing(c.id);setShowF(true);}}>✏️</button><button style={{...S.bie,background:"#fef3c7"}} onClick={()=>setDetteId(c.id)}>💰</button>{session.role==="superadmin"&&<button style={S.bid} onClick={()=>setDelId(c.id)}>🗑️</button>}</div></td></tr>);})}
      {!filtered.length&&<EmptyRow cols={7}/>}
    </tbody></table></div>
  </div>);
}
// ── CONTRATS ──
function GContrats({data,mutate,showAlert}){
  const[showF,setShowF]=useState(false);const[editing,setEditing]=useState(null);const[delId,setDelId]=useState(null);
  const em=()=>({numero:"",chauffeurId:"",motoId:"",dateDebut:tod(),dureeContrat:14,montantJournalier:200,avanceVersee:0,statut:"actif",remarque:""});
  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const montantEst=Number(form.dureeContrat)*26*Number(form.montantJournalier);
  const save_=()=>{if(!form.chauffeurId||!form.motoId){showAlert("Chauffeur et moto requis","error");return;}const dateFin=addM(form.dateDebut,form.dureeContrat);mutate(d=>{const ct={...form,id:editing||gid("ct"),dateFin,montantTotal:montantEst,dateCreation:tod()};if(editing)d.contrats=d.contrats.map(c=>c.id===editing?ct:c);else d.contrats=[...d.contrats,ct];showAlert(editing?"Modifié ✓":"Créé ✓","success");return d;});setShowF(false);setEditing(null);setForm(em());};
  const del_=(id)=>{mutate(d=>{d.contrats=d.contrats.filter(c=>c.id!==id);return d;});showAlert("Contrat supprimé","warning");setDelId(null);};
  return(<div>
    <PageHeader title="📋 Contrats" color={C.taxi} onAdd={()=>{setForm(em());setEditing(null);setShowF(true);}} label="+ Contrat"/>
    {showF&&<Modal title={editing?"✏️ Modifier":"📋 Nouveau Contrat"} onClose={()=>{setShowF(false);setEditing(null);}} onSave={save_} saveColor={C.taxi}>
      <FG2>
        <FField label="N° Contrat"><input style={S.inp} value={form.numero} onChange={e=>F("numero",e.target.value)}/></FField>
        <FField label="Chauffeur *"><select style={S.inp} value={form.chauffeurId} onChange={e=>F("chauffeurId",e.target.value)}><option value="">-- Sélectionner --</option>{data.chauffeurs.map(c=><option key={c.id} value={c.id}>{c.nom} {c.prenom}</option>)}</select></FField>
        <FField label="Moto *"><select style={S.inp} value={form.motoId} onChange={e=>F("motoId",e.target.value)}><option value="">-- Sélectionner --</option>{data.motos.map(m=><option key={m.id} value={m.id}>{m.marque} {m.modele} — {m.numeroImmat||m.code}</option>)}</select></FField>
        <FField label="Date Début"><input style={S.inp} type="date" value={form.dateDebut} onChange={e=>F("dateDebut",e.target.value)}/></FField>
        <FField label="Durée (mois)"><input style={S.inp} type="number" value={form.dureeContrat} onChange={e=>F("dureeContrat",e.target.value)}/></FField>
        <FField label="Montant Journalier (HTG)"><input style={S.inp} type="number" value={form.montantJournalier} onChange={e=>F("montantJournalier",e.target.value)}/></FField>
        <FField label="Avance Versée (HTG)"><input style={S.inp} type="number" value={form.avanceVersee} onChange={e=>F("avanceVersee",e.target.value)}/></FField>
        <FField label="Statut"><select style={S.inp} value={form.statut} onChange={e=>F("statut",e.target.value)}><option>actif</option><option>en retard</option><option>suspendu</option><option>terminé</option><option>transféré</option></select></FField>
      </FG2>
      <InfoBox c="#f0fdf4">💰 Total Estimé : <b>{fmt(montantEst)} HTG</b></InfoBox>
      <FField label="Remarque" full><textarea style={{...S.inp,height:50,resize:"vertical"}} value={form.remarque||""} onChange={e=>F("remarque",e.target.value)}/></FField>
    </Modal>}

      }

function Inventaire({data,mutate,showAlert}){

function GInvestissements({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);const[editing,setEditing]=useState(null);const[delId,setDelId]=useState(null);
  const em=()=>({titre:"",categorie:"Initial",montant:"",date:tod(),source:"Fonds propres",description:"",statut:"Actif",rendementAttendu:"",notes:""});

function Caisse({data}){
  const totalEncTaxi=data.transactions.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  const totalDepTaxi=data.depenses.reduce((s,d)=>s+Number(d.montant||0),0);
  const totalPertes=data.pertes.reduce((s,p)=>s+Number(p.coutEstime||0),0);
  const totalVentes=data.ventes.reduce((s,v)=>s+Number(v.total||0),0);
  const profitCommerce=data.ventes.reduce((s,v)=>s+Number(v.profitNet||0),0);
  const totalAchats=data.achats.reduce((s,a)=>s+Number(a.totalGeneral||0),0);
  const totalInvest=(data.investissements||[]).reduce((s,i)=>s+Number(i.montant||0),0);
  const beneficeTaxi=totalEncTaxi-totalDepTaxi-totalPertes;
  const beneficeTotal=beneficeTaxi+profitCommerce;
  const parMoisTaxi={};data.transactions.forEach(t=>{const m=t.date?.slice(0,7);if(m)parMoisTaxi[m]=(parMoisTaxi[m]||0)+Number(t.montantPaye||0);});
  const parMoisVentes={};data.ventes.forEach(v=>{const m=v.date?.slice(0,7);if(m)parMoisVentes[m]=(parMoisVentes[m]||0)+Number(v.total||0);});
  const mois=[...new Set([...Object.keys(parMoisTaxi),...Object.keys(parMoisVentes)])].sort().slice(-6);
  return(<div>
    <h2 style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:12}}>🏦 Caisse & Flux Financier</h2>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:11,marginBottom:14}}>
      {[{l:"Encaissé Taxi",v:totalEncTaxi,c:C.taxi},{l:"Dépenses Taxi",v:totalDepTaxi,c:C.danger},{l:"Pertes Taxi",v:totalPertes,c:C.danger},{l:"Bénéfice Taxi",v:beneficeTaxi,c:beneficeTaxi>=0?"#22c55e":C.danger},{l:"CA Commerce",v:totalVentes,c:C.commerce},{l:"Achats Commerce",v:totalAchats,c:C.danger},{l:"Profit Commerce",v:profitCommerce,c:profitCommerce>=0?"#10b981":C.danger},{l:"Investissements",v:totalInvest,c:C.invest},{l:"BÉNÉFICE NET TOTAL",v:beneficeTotal,c:beneficeTotal>=0?"#10b981":C.danger}].map((c,i)=>(<div key={i} style={{...S.card,borderLeft:`4px solid ${c.c}`}}><div style={{fontSize:11,color:C.textM}}>{c.l}</div><div style={{fontSize:17,fontWeight:800,color:c.c}}>{fmt(c.v)} HTG</div></div>))}
    </div>
    {mois.length>0&&(<div style={{...S.card,overflowX:"auto"}}><div style={{fontWeight:700,marginBottom:9}}>📊 Flux Mensuel</div><table style={S.table}><thead><tr><th style={S.th}>Mois</th><th style={S.th}>Taxi</th><th style={S.th}>Commerce</th><th style={S.th}>Total Entrées</th></tr></thead><tbody>{mois.map(m=>{const t=parMoisTaxi[m]||0,v=parMoisVentes[m]||0;return(<tr key={m}><td style={S.td}><b>{m}</b></td><td style={{...S.td,color:C.taxi,fontWeight:700}}>{fmt(t)} HTG</td><td style={{...S.td,color:C.commerce,fontWeight:700}}>{fmt(v)} HTG</td><td style={{...S.td,fontWeight:700}}>{fmt(t+v)} HTG</td></tr>);})}</tbody></table></div>)}

  return(<div>
    <PageHeader title="🔐 Utilisateurs" color={C.primary} onAdd={()=>{setForm(em());setShowF(true);}} label="+ Utilisateur"/>
    {showF&&<Modal title="➕ Nouvel Utilisateur" onClose={()=>setShowF(false)} onSave={()=>{if(!form.nom||!form.username||!form.password){showAlert("Tous les champs requis","error");return;}mutate(d=>{d.users=[...d.users,{...form,id:gid("u")}];return d;});showAlert("Utilisateur ajouté ✓","success");setShowF(false);}}>
      <FG2>
        <FField label="Nom"><input style={S.inp} value={form.nom} onChange={e=>F("nom",e.target.value)}/></FField>
        <FField label="Username"><input style={S.inp} value={form.username} onChange={e=>F("username",e.target.value)}/></FField>
        <FField label="Mot de passe"><input style={S.inp} type="password" value={form.password} onChange={e=>F("password",e.target.value)}/></FField>
        <FField label="Rôle"><select style={S.inp} value={form.role} onChange={e=>F("role",e.target.value)}><option value="agent">Agent</option><option value="superadmin">Super Admin</option></select></FField>
      </FG2>
    </Modal>}
    <div style={S.card}>{data.users.map(u=>(<div key={u.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",borderRadius:10,background:"#f8fafc",marginBottom:7}}><div><div style={{fontWeight:700,fontSize:13}}>{u.nom}</div><div style={{fontSize:11,color:C.textM}}>@{u.username} · <span style={{color:u.role==="superadmin"?C.taxi:C.primary}}>{u.role==="superadmin"?"Super Admin":"Agent"}</span> · <span style={{color:u.actif?"#22c55e":C.danger}}>{u.actif?"Actif":"Inactif"}</span></div></div><button style={{...S.bie,background:u.actif?"#fef2f2":"#f0fdf4"}} onClick={()=>mutate(d=>{d.users=d.users.map(x=>x.id===u.id?{...x,actif:!x.actif}:x);return d;})}>{u.actif?"🔒":"🔓"}</button></div>))}</div>
  </div>);
}
// ── EXTENSIONS ──
function GExtensions({data,mutate,showAlert}){
  const[showF,setShowF]=useState(false);const[delId,setDelId]=useState(null);
  const em=()=>({nom:"",icon:"🧩",description:"",champs:[]});
  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const[champF,setChampF]=useState({label:"",type:"text"});
  return(<div>
    <PageHeader title="🧩 Extensions" color={C.primary} onAdd={()=>{setForm(em());setShowF(true);}} label="+ Nouveau Module"/>
    <InfoBox c="#eef2ff">Créez vos propres modules personnalisés sans modifier le code source.</InfoBox>
    <Sp h={10}/>
    {showF&&<Modal title="🧩 Nouveau Module" onClose={()=>setShowF(false)} onSave={()=>{if(!form.nom){showAlert("Nom requis","error");return;}mutate(d=>{d.modules=[...d.modules,{...form,id:gid("mod"),dateCreation:tod(),enregistrements:[]}];return d;});showAlert("Module créé ✓","success");setShowF(false);}}>
      <FG2><FField label="Nom *"><input style={S.inp} value={form.nom} onChange={e=>F("nom",e.target.value)}/></FField><FField label="Icône (emoji)"><input style={S.inp} value={form.icon} onChange={e=>F("icon",e.target.value)}/></FField></FG2>
      <FField label="Description" full><input style={S.inp} value={form.description||""} onChange={e=>F("description",e.target.value)}/></FField>
      <Sp h={10}/><SectionLabel c={C.primary}>📋 Champs</SectionLabel>
      <div style={{background:"#f8fafc",borderRadius:10,padding:12,marginBottom:10}}>
        <FG2><FField label="Nom du Champ"><input style={S.inp} value={champF.label} onChange={e=>setChampF(f=>({...f,label:e.target.value}))}/></FField><FField label="Type"><select style={S.inp} value={champF.type} onChange={e=>setChampF(f=>({...f,type:e.target.value}))}><option value="text">Texte</option><option value="number">Nombre</option><option value="date">Date</option></select></FField></FG2>
        <button style={{...S.bp,fontSize:12}} onClick={()=>{if(!champF.label)return;setForm(f=>({...f,champs:[...f.champs,{id:gid("cf"),label:champF.label,type:champF.type}]}));setChampF({label:"",type:"text"});}}>+ Ajouter Champ</button>
      </div>
      {form.champs.map((c,i)=>(<div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"#f0f9ff",borderRadius:8,marginBottom:6}}><span style={{fontSize:13}}><b>{c.label}</b> <span style={{color:C.textL}}>({c.type})</span></span><button style={{...S.bid,padding:"3px 8px",fontSize:12}} onClick={()=>setForm(f=>({...f,champs:f.champs.filter((_,j)=>j!==i)}))}>✕</button></div>))}
    </Modal>}
    {delId&&<ConfirmDel onConfirm={()=>{mutate(d=>{d.modules=d.modules.filter(m=>m.id!==delId);return d;});showAlert("Module supprimé","warning");setDelId(null);}} onCancel={()=>setDelId(null)} item="ce module personnalisé"/>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:12}}>
      {(data.modules||[]).map(m=>(<div key={m.id} style={{...S.card,borderTop:`4px solid ${C.primary}`}}><div style={{fontSize:26,marginBottom:5}}>{m.icon}</div><div style={{fontWeight:800,fontSize:14}}>{m.nom}</div><div style={{fontSize:12,color:C.textM,marginBottom:7}}>{m.description}</div><div style={{fontSize:11,color:C.textL,marginBottom:10}}>{(m.champs||[]).length} champs · {(m.enregistrements||[]).length} enregistrements</div><button style={{...S.bid,fontSize:12}} onClick={()=>setDelId(m.id)}>🗑️ Supprimer</button></div>))}
      {!(data.modules||[]).length&&<div style={{...S.card,textAlign:"center",color:C.textL,gridColumn:"1/-1",padding:40}}>🧩 Aucun module créé.</div>}
    </div>
  </div>);
}
function ExtView({module:m}){return(<div><h2 style={{fontSize:18,fontWeight:800,margin:"0 0 12px"}}>{m.icon} {m.nom}</h2><InfoBox c="#eef2ff">Module personnalisé — {(m.champs||[]).length} champs · Gérez via ⚙️ Extensions</InfoBox></div>);}
// ── PARAMÈTRES ──
function Parametres({session,data,mutate,showAlert,onClose,setSession}){
  const[tab,setTab]=useState("profil");const[nom,setNom]=useState(session.nom);const[username,setUsername]=useState(session.username);const[oldPwd,setOldPwd]=useState("");const[newPwd,setNewPwd]=useState("");const[confPwd,setConfPwd]=useState("");const[editUser,setEditUser]=useState(null);const[euNom,setEuNom]=useState("");const[euUser,setEuUser]=useState("");const[euPwd,setEuPwd]=useState("");const[euRole,setEuRole]=useState("agent");
  const tb2=(t)=>({padding:"9px 14px",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,borderBottom:tab===t?`2px solid ${C.primary}`:"2px solid transparent",color:tab===t?C.primary:C.textM,background:"transparent"});
  return(<div style={S.modal}><div style={{...S.mbox,maxWidth:480}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{...S.mtitle,margin:0}}>⚙️ Paramètres</h3><button style={{background:"transparent",border:"none",fontSize:20,cursor:"pointer",color:C.textM}} onClick={onClose}>✕</button></div>
    <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,marginBottom:16}}><button style={tb2("profil")} onClick={()=>setTab("profil")}>👤 Profil</button><button style={tb2("pwd")} onClick={()=>setTab("pwd")}>🔑 Mot de passe</button>{session.role==="superadmin"&&<button style={tb2("users")} onClick={()=>setTab("users")}>👥 Utilisateurs</button>}</div>
    {tab==="profil"&&(<div><div style={S.fg1}><label style={S.lbl}>Nom complet</label><input style={S.inp} value={nom} onChange={e=>setNom(e.target.value)}/></div><div style={S.fg1}><label style={S.lbl}>Nom d'utilisateur</label><input style={S.inp} value={username} onChange={e=>setUsername(e.target.value)}/></div><InfoBox c="#f8fafc">Rôle : <b style={{color:C.primary}}>{session.role==="superadmin"?"Super Admin":"Agent"}</b></InfoBox><Sp h={10}/><button style={S.bp} onClick={()=>{if(!nom||!username){showAlert("Requis","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,nom,username}:u);return d;});setSession(s=>({...s,nom,username}));showAlert("Profil mis à jour ✓","success");}}>💾 Enregistrer</button></div>)}
    {tab==="pwd"&&(<div><div style={S.fg1}><label style={S.lbl}>Ancien mot de passe</label><input style={S.inp} type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)}/></div><div style={S.fg1}><label style={S.lbl}>Nouveau mot de passe</label><input style={S.inp} type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)}/></div><div style={S.fg1}><label style={S.lbl}>Confirmer</label><input style={S.inp} type="password" value={confPwd} onChange={e=>setConfPwd(e.target.value)}/></div>{newPwd&&confPwd&&newPwd!==confPwd&&<p style={{color:C.danger,fontSize:12,marginBottom:8}}>⚠ Ne correspondent pas</p>}<button style={S.bp} onClick={()=>{const usr=data.users.find(u=>u.id===session.id);if(usr.password!==oldPwd){showAlert("Ancien mot de passe incorrect","error");return;}if(newPwd.length<6){showAlert("Min 6 caractères","error");return;}if(newPwd!==confPwd){showAlert("Ne correspondent pas","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,password:newPwd}:u);return d;});setOldPwd("");setNewPwd("");setConfPwd("");showAlert("Mot de passe modifié ✓","success");}}>🔑 Changer</button></div>)}
    {tab==="users"&&session.role==="superadmin"&&(<div>{editUser?(<div><div style={{fontWeight:700,color:C.primary,marginBottom:10,fontSize:13}}>✏️ {editUser.nom}</div><FG2><FField label="Nom"><input style={S.inp} value={euNom} onChange={e=>setEuNom(e.target.value)}/></FField><FField label="Username"><input style={S.inp} value={euUser} onChange={e=>setEuUser(e.target.value)}/></FField><FField label="Nouveau mot de passe (optionnel)"><input style={S.inp} type="password" value={euPwd} onChange={e=>setEuPwd(e.target.value)}/></FField><FField label="Rôle"><select style={S.inp} value={euRole} onChange={e=>setEuRole(e.target.value)}><option value="agent">Agent</option><option value="superadmin">Super Admin</option></select></FField></FG2><div style={{display:"flex",gap:10}}><button style={S.bs} onClick={()=>setEditUser(null)}>Annuler</button><button style={S.bp} onClick={()=>{mutate(d=>{d.users=d.users.map(u=>u.id===editUser.id?{...u,nom:euNom,username:euUser,role:euRole,...(euPwd?{password:euPwd}:{})}:u);return d;});showAlert("Modifié ✓","success");setEditUser(null);}}>💾 Enregistrer</button></div></div>):(<div>{data.users.map(u=>(<div key={u.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 11px",borderRadius:9,background:"#f8fafc",marginBottom:7}}><div><div style={{fontWeight:700,fontSize:13}}>{u.nom}</div><div style={{fontSize:11,color:C.textM}}>@{u.username} · {u.role==="superadmin"?"Super Admin":"Agent"} · <span style={{color:u.actif?"#22c55e":C.danger}}>{u.actif?"Actif":"Inactif"}</span></div></div><div style={{display:"flex",gap:5}}><button style={S.bie} onClick={()=>{setEditUser(u);setEuNom(u.nom);setEuUser(u.username);setEuPwd("");setEuRole(u.role);}}>✏️</button><button style={{...S.bie,background:u.actif?"#fef2f2":"#f0fdf4"}} onClick={()=>mutate(d=>{d.users=d.users.map(x=>x.id===u.id?{...x,actif:!x.actif}:x);return d;})}>{u.actif?"🔒":"🔓"}</button></div></div>))}</div>)}</div>)}
    <div style={S.mact}><button style={S.bs} onClick={onClose}>Fermer</button></div>
  </div></div>);
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
