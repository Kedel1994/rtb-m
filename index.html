const loadLocal=()=>{try{const r=localStorage.getItem(SK);return r?{...DEF,...JSON.parse(r)}:{...DEF}}catch{return{...DEF}}};
const saveLocal=(d)=>{try{localStorage.setItem(SK,JSON.stringify({...d,lastSync:new Date().toISOString()}));return true}catch{return false}};
const saveFirebase=async(d)=>{if(!db)return false;try{await db.ref("rtbm_data").set(JSON.parse(JSON.stringify({...d,lastSync:new Date().toISOString()})));return true}catch{return false}};
const listenFirebase=(cb)=>{if(!db)return()=>{};const ref=db.ref("rtbm_data");ref.on("value",s=>{const v=s.val();if(v){saveLocal(v);cb(v);}});return()=>ref.off("value");};

const fmt=(n)=>Number(n||0).toLocaleString("fr");
const tod=()=>new Date().toISOString().split("T")[0];
const addM=(ds,m)=>{const d=new Date(ds);d.setMonth(d.getMonth()+Number(m));return d.toISOString().split("T")[0]};

  loginBg:{minHeight:"100vh",background:`linear-gradient(135deg,${C.dark},${C.dark2})`,display:"flex",alignItems:"center",justifyContent:"center"},
  loginCard:{background:C.dark2,borderRadius:18,padding:34,width:"100%",maxWidth:380,textAlign:"center",border:`1px solid #334155`},

  {id:"contrats",icon:"📋",label:"Contrats",module:"taxi"},
  {id:"transactions",icon:"💳",label:"Paiements",module:"taxi"},
  {id:"depenses",icon:"💸",label:"Dépenses Taxi",module:"taxi"},
  {id:"pertes",icon:"⚠️",label:"Pertes",module:"taxi"},
  {id:"transferts",icon:"🔄",label:"Transferts",module:"taxi"},
  // COMMERCE
  {id:"produits",icon:"📦",label:"Produits",module:"commerce"},
  {id:"ventes",icon:"🧾",label:"Ventes",module:"commerce"},
  {id:"achats",icon:"🛒",label:"Achats Fournisseurs",module:"commerce"},

const MODULE_COLORS={taxi:C.taxi,commerce:C.commerce,core:C.primary};

/* ══════════════════════════════
   APP
══════════════════════════════ */
function App(){
  const[data,setData]=useState(loadLocal);
  const[session,setSession]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[saveStatus,setSaveStatus]=useState("✓ Local");
  const[syncStatus,setSyncStatus]=useState(FB_OK?"🔄 Connexion...":"⚠️ Mode Local");
  const[alert,setAlert]=useState(null);
  const[menuOpen,setMenuOpen]=useState(false);
  const[showParams,setShowParams]=useState(false);
  const[fbReady,setFbReady]=useState(false);
  const saveTimer=useRef(null);
  const isRemote=useRef(false);

  useEffect(()=>{
    if(!FB_OK){setSyncStatus("⚠️ Mode Local");return;}
    const unsub=listenFirebase(d=>{setFbReady(true);setSyncStatus("🟢 "+new Date().toLocaleTimeString("fr"));isRemote.current=true;setData(d);});
    return unsub;
  },[]);

  useEffect(()=>{
    if(!session)return;
    if(isRemote.current){isRemote.current=false;return;}
    setSaveStatus("💾...");
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      saveLocal(data);
      if(FB_OK&&fbReady){const ok=await saveFirebase(data);setSaveStatus(ok?"✓ Cloud":"✓ Local");if(ok)setSyncStatus("🟢 "+new Date().toLocaleTimeString("fr"));}
      else setSaveStatus("✓ Local");
    },800);
  },[data,session,fbReady]);

  const showAlert=(msg,type="info")=>{setAlert({msg,type});setTimeout(()=>setAlert(null),4500);};
  const mutate=useCallback(fn=>setData(prev=>fn({...prev})),[]);
  const navTo=(p)=>{setPage(p);setMenuOpen(false);};

  if(!session)return <Login users={data.users} onLogin={u=>setSession(u)} fbOk={FB_OK}/>;

  const alertColors={info:"#3b82f6",success:"#22c55e",error:"#ef4444",warning:"#f59e0b"};
  const navItem=NAV.find(n=>n.id===page);
  const pageColor=MODULE_COLORS[navItem?.module||"core"];
  const pageLabel=navItem?.label||"";

  const allNav=[...NAV,...(data.modules||[]).map(m=>({id:"ext_"+m.id,icon:m.icon||"🧩",label:m.nom,module:"ext"}))];

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden",background:C.bg}}>

      {/* TOPBAR */}
      <div id="topbar" style={{display:"flex",alignItems:"center",background:C.dark,padding:"0 12px",height:50,flexShrink:0,gap:10,zIndex:600}}>
        <button onClick={()=>setMenuOpen(o=>!o)} style={{background:"transparent",border:"none",color:"#fff",fontSize:22,padding:"4px 6px",borderRadius:6,cursor:"pointer",lineHeight:1}}>
          {menuOpen?"✕":"☰"}
        </button>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,minWidth:0}}>
          <span style={{fontWeight:900,color:"#f8fafc",fontSize:14,letterSpacing:.5,whiteSpace:"nowrap"}}>RTB-M</span>
          <span style={{color:"#475569",fontSize:12}}>|</span>
          <span style={{color:pageColor,fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pageLabel}</span>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
          <span style={{fontSize:10,color:saveStatus.includes("✓")?"#22c55e":"#f59e0b",whiteSpace:"nowrap"}}>{saveStatus}</span>
          <button onClick={()=>setShowParams(true)} style={{background:C.dark2,border:"none",color:"#94a3b8",fontSize:17,padding:"5px 8px",borderRadius:7,cursor:"pointer"}}>⚙️</button>
        </div>
      </div>

      {/* SYNC BAR */}
      <div style={{background:FB_OK&&fbReady?"#052e16":"#1c1917",padding:"2px 14px",fontSize:10,color:FB_OK&&fbReady?"#86efac":"#fbbf24",flexShrink:0}}>
        {syncStatus}
      </div>

      {/* SIDEBAR */}
      {menuOpen&&<div id="sidebar-overlay" style={{position:"fixed",inset:0,zIndex:490,background:"rgba(0,0,0,.5)"}} onClick={()=>setMenuOpen(false)}/>}
      <div id="sidebar" style={{position:"fixed",top:0,left:0,height:"100vh",width:240,background:C.dark,zIndex:500,transform:menuOpen?"translateX(0)":"translateX(-100%)",transition:"transform .25s ease",display:"flex",flexDirection:"column",overflowY:"auto"}}>
        {/* Logo */}
        <div style={{padding:"16px 14px",borderBottom:`1px solid ${C.dark2}`}}>
          <div style={{fontWeight:900,color:"#f8fafc",fontSize:16}}>RTB-M</div>
          <div style={{fontSize:11,color:"#64748b"}}>Rose-Thamar & Blonde Multi Services</div>
          <div style={{marginTop:8,fontSize:11,color:FB_OK&&fbReady?"#86efac":"#f59e0b"}}>{syncStatus}</div>
        </div>
        {/* User */}
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.dark2}`}}>
          <div style={{color:"#94a3b8",fontSize:12,fontWeight:600}}>{session.nom}</div>
          <div style={{color:C.taxi,fontSize:11}}>{session.role==="superadmin"?"Super Admin":"Agent"}</div>
        </div>
        {/* Nav groups */}
        <div style={{flex:1,overflowY:"auto",paddingBottom:12}}>
          {/* Core */}
          <div style={{padding:"8px 14px 4px",fontSize:10,color:"#475569",fontWeight:700,letterSpacing:1}}>GÉNÉRAL</div>
          {allNav.filter(n=>n.module==="core"&&(!n.admin||session.role==="superadmin")).map(n=>(
            <NavBtn key={n.id} n={n} active={page===n.id} color={C.primary} onClick={()=>navTo(n.id)}/>
          ))}
          {/* Taxi */}
          <div style={{padding:"8px 14px 4px",marginTop:4,fontSize:10,color:C.taxi,fontWeight:700,letterSpacing:1}}>🏍️ MODULE TAXI</div>
          {allNav.filter(n=>n.module==="taxi").map(n=>(
            <NavBtn key={n.id} n={n} active={page===n.id} color={C.taxi} onClick={()=>navTo(n.id)}/>
          ))}
          {/* Commerce */}
          <div style={{padding:"8px 14px 4px",marginTop:4,fontSize:10,color:C.commerce,fontWeight:700,letterSpacing:1}}>🛒 MODULE COMMERCE</div>
          {allNav.filter(n=>n.module==="commerce").map(n=>(
            <NavBtn key={n.id} n={n} active={page===n.id} color={C.commerce} onClick={()=>navTo(n.id)}/>
          ))}
          {/* Extensions */}
          {(data.modules||[]).length>0&&(
            <>
              <div style={{padding:"8px 14px 4px",marginTop:4,fontSize:10,color:"#a78bfa",fontWeight:700,letterSpacing:1}}>🧩 EXTENSIONS</div>
              {allNav.filter(n=>n.module==="ext").map(n=>(
                <NavBtn key={n.id} n={n} active={page===n.id} color="#a78bfa" onClick={()=>navTo(n.id)}/>
              ))}
            </>
          )}
        </div>
        {/* Bottom */}
        <div style={{padding:"12px 14px",borderTop:`1px solid ${C.dark2}`,display:"flex",flexDirection:"column",gap:8}}>
          <button style={{background:C.dark2,border:"none",color:"#94a3b8",padding:"9px 12px",borderRadius:8,textAlign:"left",fontSize:13,cursor:"pointer"}} onClick={()=>{setShowParams(true);setMenuOpen(false);}}>⚙️ Paramètres</button>
          <button style={{...S.bd,width:"100%",fontSize:12}} onClick={()=>{setSession(null);setPage("dashboard");setMenuOpen(false);}}>🚪 Déconnexion</button>
        </div>
      </div>

      {/* ALERT */}
      {alert&&<div style={{background:alertColors[alert.type],color:"#fff",padding:"8px 16px",fontSize:13,fontWeight:600,flexShrink:0}}>{alert.msg}</div>}

      {/* CONTENT */}
      <div style={{flex:1,overflowY:"auto",padding:"14px"}}>
        {page==="dashboard"    && <Dashboard data={data} setPage={navTo} session={session}/>}
        {/* TAXI */}
        {page==="motos"        && <GMotos data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="chauffeurs"   && <GChauffeurs data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="contrats"     && <GContrats data={data} mutate={mutate} showAlert={showAlert}/>}
        {page==="transactions" && <GTransactions data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="depenses"     && <GDepenses data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="pertes"       && <GPertes data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="transferts"   && <GTransferts data={data} mutate={mutate} showAlert={showAlert}/>}
        {/* COMMERCE */}
        {page==="produits"     && <GProduits data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="ventes"       && <GVentes data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="achats"       && <GAchats data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="clients"      && <GClients data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="fournisseurs" && <GFournisseurs data={data} mutate={mutate} showAlert={showAlert} session={session}/>}
        {page==="stock"        && <GStock data={data}/>}
        {/* CORE */}
        {page==="caisse"       && <Caisse data={data}/>}
        {page==="rapports"     && <Rapports data={data}/>}
        {page==="utilisateurs" && session.role==="superadmin" && <GUsers data={data} mutate={mutate} showAlert={showAlert}/>}
        {page==="extensions"   && session.role==="superadmin" && <GExtensions data={data} mutate={mutate} showAlert={showAlert}/>}
        {/* EXTENSIONS DYNAMIQUES */}
        {(data.modules||[]).map(m=>page==="ext_"+m.id&&<ExtensionView key={m.id} module={m}/>)}
      </div>

      {showParams&&<Parametres session={session} data={data} mutate={mutate} showAlert={showAlert} onClose={()=>setShowParams(false)} setSession={setSession}/>}
    </div>
  );
}

function NavBtn({n,active,color,onClick}){
  return(
    <button onClick={onClick} style={{display:"flex",alignItems:"center",gap:9,width:"100%",padding:"10px 16px",background:active?`${color}22`:"transparent",border:"none",color:active?"#f8fafc":"#94a3b8",fontSize:13,cursor:"pointer",textAlign:"left",borderLeft:active?`3px solid ${color}`:"3px solid transparent"}}>
      <span style={{fontSize:15}}>{n.icon}</span><span>{n.label}</span>
    </button>
  );
}

/* ══════════════════════════════ LOGIN ══════════════════════════════ */
function Login({users,onLogin,fbOk}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");
  const go=()=>{const usr=users.find(x=>x.username===u&&x.password===p&&x.actif);if(usr)onLogin(usr);else setErr("Identifiants incorrects.");};
  return(
    <div style={S.loginBg}>
      <div style={S.loginCard}>
        <div style={{fontSize:52,marginBottom:6}}>🏍️🛒</div>
        <h1 style={{color:"#f8fafc",fontSize:18,fontWeight:900,letterSpacing:1,margin:"0 0 2px"}}>ROSE-THAMAR & BLONDE</h1>
        <div style={{color:"#f8fafc",fontSize:14,fontWeight:700,marginBottom:4}}>MULTI SERVICES</div>
        <p style={{color:C.primary,fontSize:11,fontStyle:"italic",marginBottom:10}}>RTB-M : Mobilité, Commerce & Progrès</p>
        <div style={{background:"#0f172a",borderRadius:8,padding:"5px 12px",marginBottom:18,fontSize:11,color:fbOk?"#86efac":"#f59e0b"}}>
          {fbOk?"🟢 Firebase activé":"⚠️ Mode Local"}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input style={{...S.inp,background:"#0f172a",color:"#f8fafc",border:"1px solid #334155"}} placeholder="Nom d'utilisateur" value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/>
          <input style={{...S.inp,background:"#0f172a",color:"#f8fafc",border:"1px solid #334155"}} type="password" placeholder="Mot de passe" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/>
          {err&&<p style={{color:"#ff6b6b",fontSize:12}}>{err}</p>}
          <button style={S.bp} onClick={go}>🔐 Se Connecter</button>
        </div>
        <p style={{color:"#475569",fontSize:11,marginTop:18}}>© 2024 RTB-M — Rose-Thamar & Blonde Multi Services</p>
      </div>
    </div>
  );
}

/* ══════════════════════════════ DASHBOARD ══════════════════════════════ */
function Dashboard({data,setPage,session}){
  const today=tod();
  // TAXI
  const contratsA=data.contrats.filter(c=>c.statut==="actif");
  const txToday=data.transactions.filter(t=>t.date===today);
  const totalTxToday=txToday.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  const totalEnc=data.transactions.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  // COMMERCE
  const totalVentes=data.ventes.reduce((s,v)=>s+Number(v.total||0),0);
  const ventesToday=data.ventes.filter(v=>v.date===today).reduce((s,v)=>s+Number(v.total||0),0);
  const totalAchats=data.achats.reduce((s,a)=>s+Number(a.totalGeneral||0),0);
  const profitCommerce=data.ventes.reduce((s,v)=>s+Number(v.profitNet||0),0);
  // ALERTES
  const stockAlerts=data.produits.filter(p=>Number(p.stockUnites||0)<=Number(p.minStockAlert||0));
  const alertEch=data.contrats.filter(c=>{if(c.statut!=="actif")return false;const j=daysBetween(today,c.dateFin);return j>=0&&j<=30;});
  const clientsDus=data.clients.filter(c=>Number(c.balanceDue||0)>0);

  const cards=[
    {g:"taxi",l:"Motos",v:data.motos.length,ic:"🏍️",sub:`${contratsA.length} contrats actifs`,page:"motos"},
    {g:"taxi",l:"Encaissé Aujourd'hui",v:`${fmt(totalTxToday)} HTG`,ic:"💳",sub:`${txToday.length} paiements`,page:"transactions"},
    {g:"taxi",l:"Total Taxi Encaissé",v:`${fmt(totalEnc)} HTG`,ic:"💰",sub:`${data.chauffeurs.length} chauffeurs`,page:"caisse"},
    {g:"commerce",l:"Produits en Stock",v:data.produits.length,ic:"📦",sub:`${stockAlerts.length} alertes stock`,page:"produits"},
    {g:"commerce",l:"Ventes Aujourd'hui",v:`${fmt(ventesToday)} HTG`,ic:"🧾",sub:`${data.ventes.filter(v=>v.date===today).length} factures`,page:"ventes"},
    {g:"commerce",l:"Profit Commerce",v:`${fmt(profitCommerce)} HTG`,ic:"📈",sub:`Total ${fmt(totalVentes)} HTG en ventes`,page:"rapports"},
    {g:"commerce",l:"Total Achats",v:`${fmt(totalAchats)} HTG`,ic:"🛒",sub:`${data.achats.length} commandes`,page:"achats"},
    {g:"core",l:"Clients",v:data.clients.length,ic:"👥",sub:`${clientsDus.length} avec balance due`,page:"clients"},
  ];

  return(
    <div>
      <div style={{marginBottom:14}}>
        <h2 style={{fontSize:18,fontWeight:800,color:C.text,margin:"0 0 2px"}}>📊 Tableau de Bord</h2>
        <div style={{fontSize:12,color:C.textM}}>📅 {new Date().toLocaleDateString("fr",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:12,marginBottom:14}}>
        {cards.map((c,i)=>{
          const col=c.g==="taxi"?C.taxi:c.g==="commerce"?C.commerce:C.primary;
          return(
            <div key={i} onClick={()=>setPage(c.page)} style={{...S.card,borderLeft:`4px solid ${col}`,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontSize:11,color:C.textM,fontWeight:600}}>{c.l}</div>
                  <div style={{fontSize:18,fontWeight:800,color:C.text,margin:"3px 0"}}>{c.v}</div>
                  <div style={{fontSize:10,color:C.textL}}>{c.sub}</div>
                </div>
                <span style={{fontSize:24}}>{c.ic}</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* Alertes */}
      {(alertEch.length>0||stockAlerts.length>0||clientsDus.length>0)&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12,marginBottom:14}}>
          {alertEch.length>0&&(
            <div style={{...S.card,borderLeft:`4px solid ${C.taxi}`}}>
              <div style={{fontWeight:700,color:C.taxi,fontSize:13,marginBottom:8}}>⏰ Contrats Proches Échéance</div>
              {alertEch.slice(0,4).map(c=>{const ch=data.chauffeurs.find(x=>x.id===c.chauffeurId);return(
                <div key={c.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>
                  👤 {ch?.nom} {ch?.prenom} — <b>{daysBetween(today,c.dateFin)}j</b>
                </div>
              );})}
            </div>
          )}
          {stockAlerts.length>0&&(
            <div style={{...S.card,borderLeft:`4px solid ${C.commerce}`}}>
              <div style={{fontWeight:700,color:C.commerce,fontSize:13,marginBottom:8}}>📦 Stock Faible ({stockAlerts.length})</div>
              {stockAlerts.slice(0,4).map(p=>(
                <div key={p.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>
                  📦 {p.nom} — <b style={{color:C.danger}}>{p.stockUnites||0} unités</b>
                </div>
              ))}
            </div>
          )}
          {clientsDus.length>0&&(
            <div style={{...S.card,borderLeft:`4px solid ${C.danger}`}}>
              <div style={{fontWeight:700,color:C.danger,fontSize:13,marginBottom:8}}>💰 Clients avec Balance Due</div>
              {clientsDus.slice(0,4).map(c=>(
                <div key={c.id} style={{fontSize:12,color:C.textM,padding:"4px 0",borderBottom:`1px solid #f1f5f9`}}>
                  👥 {c.nom} — <b style={{color:C.danger}}>{fmt(c.balanceDue)} HTG</b>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Dernières ventes */}
      <div style={S.card}>
        <div style={{fontWeight:700,color:C.text,fontSize:14,marginBottom:10}}>🧾 Dernières Ventes</div>
        <div style={{overflowX:"auto"}}>
          <table style={S.table}>
            <thead><tr><th style={S.th}>Date</th><th style={S.th}>Client</th><th style={S.th}>Total</th><th style={S.th}>Profit</th><th style={S.th}>Statut</th></tr></thead>
            <tbody>
              {data.ventes.slice(-6).reverse().map(v=>(
                <tr key={v.id}>
                  <td style={S.td}>{v.date}</td>
                  <td style={S.td}>{v.clientNom||"—"}</td>
                  <td style={{...S.td,fontWeight:700,color:C.commerce}}>{fmt(v.total)} HTG</td>
                  <td style={{...S.td,color:"#10b981"}}>{fmt(v.profitNet)} HTG</td>
                  <td style={S.td}><SBadge s={v.statutPaiement||"Payé"}/></td>
                </tr>
              ))}
              {!data.ventes.length&&<tr><td colSpan={5} style={{...S.td,textAlign:"center",color:C.textL}}>Aucune vente enregistrée</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════ MOTOS ══════════════════════════════ */

  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const coutT=(m)=>[m.prixAchat,m.fraisTransport,m.fraisDedouanement,m.fraisLegalisation,m.fraisImmatriculation,m.autresFrais].reduce((s,v)=>s+Number(v||0),0);

    mutate(d=>{if(editing)d.motos=d.motos.map(m=>m.id===editing?{...form,id:editing}:m);else d.motos=[...d.motos,{...form,id:gid("moto"),dateCreation:tod()}];showAlert(editing?"Modifié":"Ajouté","success");return d;});
    setShowF(false);setEditing(null);setForm(em());

          <FField key={k} label={l}><input style={S.inp} type={t||"text"} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>
        ))}
        <FField label="Type"><select style={S.inp} value={form.type} onChange={e=>F("type",e.target.value)}><option>2 roues</option><option>3 roues</option></select></FField>
        <FField label="État"><select style={S.inp} value={form.etat} onChange={e=>F("etat",e.target.value)}><option>neuve</option><option>usagée</option></select></FField>
        <FField label="Statut"><select style={S.inp} value={form.statut} onChange={e=>F("statut",e.target.value)}><option>disponible</option><option>attribuée</option><option>en maintenance</option></select></FField>
        </FG2>
        <FField label="Description"><textarea style={{...S.inp,height:55,resize:"vertical"}} value={form.description||""} onChange={e=>F("description",e.target.value)}/></FField>
      </Modal>}
      <div style={{...S.card,overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["Code","Type","Marque/Modèle","Immat.","État","Statut","Coût Total","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map(m=>(
              <tr key={m.id}>
                <td style={S.td}><span style={{...S.badge,background:"#f1f5f9",color:C.textM}}>{m.code||"—"}</span></td>
                <td style={S.td}><span style={{...S.badge,background:m.type==="2 roues"?"#dbeafe":"#fef3c7",color:m.type==="2 roues"?"#1d4ed8":"#92400e"}}>{m.type}</span></td>
                <td style={S.td}><b>{m.marque}</b> {m.modele} <span style={{color:C.textL}}>{m.annee}</span></td>
                <td style={S.td}>{m.numeroImmat||"—"}</td>
                <td style={S.td}><span style={{color:m.etat==="neuve"?"#22c55e":"#f59e0b"}}>● {m.etat}</span></td>
                <td style={S.td}><SBadge s={m.statut}/></td>
                <td style={{...S.td,fontWeight:700}}>{fmt(coutT(m))} HTG</td>
                <td style={S.td}><RowActions onEdit={()=>{setForm(m);setEditing(m.id);setShowF(true);}} onDel={session.role==="superadmin"?()=>{if(confirm("Supprimer?"))mutate(d=>{d.motos=d.motos.filter(x=>x.id!==m.id);return d;});}:null}/></td>
              </tr>
            ))}
            {!filtered.length&&<EmptyRow cols={8}/>}

        </table>

    </div>
  );
}

/* ══════════════════════════════ CHAUFFEURS ══════════════════════════════ */
function GChauffeurs({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);const[editing,setEditing]=useState(null);const[search,setSearch]=useState("");const[detteId,setDetteId]=useState(null);
  const em=()=>({code:"",nom:"",prenom:"",sexe:"Masculin",dateNaissance:"",cin:"",telephone:"",whatsapp:"",adresse:"",permis:"",categoriePermis:"",dateExpPermis:"",experience:"",temoinNom:"",temoinTel:"",temoinAdresse:"",temoinRelation:"",temoinCin:"",changementCouleur:"",remplacementMoteur:"",autresModifications:"",statut:"actif"});
  const[form,setForm]=useState(em());const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const calcDette=(ch)=>{const ct=data.contrats.find(c=>c.chauffeurId===ch.id&&c.statut==="actif");if(!ct)return null;const jA=Math.max(0,daysBetween(ct.dateDebut,tod())+1);const txs=data.transactions.filter(t=>t.contratId===ct.id);const totalP=txs.reduce((s,t)=>s+Number(t.montantPaye||0),0);const attendu=jA*Number(ct.montantJournalier||0);return{ct,totalP,attendu,dette:Math.max(0,attendu-totalP),nbP:txs.length};};
  const save_=()=>{if(!form.nom||!form.prenom){showAlert("Nom et prénom requis","error");return;}mutate(d=>{if(editing)d.chauffeurs=d.chauffeurs.map(c=>c.id===editing?{...form,id:editing}:c);else d.chauffeurs=[...d.chauffeurs,{...form,id:gid("ch"),dateCreation:tod()}];showAlert(editing?"Modifié":"Ajouté","success");return d;});setShowF(false);setEditing(null);setForm(em());};
  const filtered=data.chauffeurs.filter(c=>`${c.nom}${c.prenom}${c.cin}${c.telephone}`.toLowerCase().includes(search.toLowerCase()));
  return(
    <div>
      <PageHeader title="👤 Chauffeurs" color={C.taxi} onAdd={()=>{setForm(em());setEditing(null);setShowF(true);}} label="+ Chauffeur"/>
      <input style={{...S.inp,maxWidth:280,marginBottom:12}} placeholder="🔍 Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
      {showF&&<Modal title={editing?"✏️ Modifier Chauffeur":"➕ Nouveau Chauffeur"} onClose={()=>setShowF(false)} onSave={save_}>
        <SectionLabel c={C.taxi}>📋 Informations Personnelles</SectionLabel>
        <FG2>{[["code","Code"],["nom","Nom *"],["prenom","Prénom *"],["cin","CIN/NIF"],["telephone","Téléphone"],["whatsapp","WhatsApp"],["adresse","Adresse"],["dateNaissance","Date Naissance","date"],["permis","N° Permis"],["categoriePermis","Catégorie Permis"],["dateExpPermis","Exp. Permis","date"],["experience","Expérience"]].map(([k,l,t])=>(
          <FField key={k} label={l}><input style={S.inp} type={t||"text"} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>
        ))}
        <FField label="Sexe"><select style={S.inp} value={form.sexe} onChange={e=>F("sexe",e.target.value)}><option>Masculin</option><option>Féminin</option></select></FField>
        <FField label="Statut"><select style={S.inp} value={form.statut} onChange={e=>F("statut",e.target.value)}><option>actif</option><option>suspendu</option><option>inactif</option></select></FField>
        </FG2>
        <SectionLabel c={C.taxi}>👥 Témoin</SectionLabel>
        <FG2>{[["temoinNom","Nom"],["temoinTel","Téléphone"],["temoinAdresse","Adresse"],["temoinRelation","Relation"],["temoinCin","CIN"]].map(([k,l])=>(
          <FField key={k} label={l}><input style={S.inp} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>
        ))}</FG2>
        <SectionLabel c={C.taxi}>🔧 Modifications Moto</SectionLabel>
        <FG2>{[["changementCouleur","Couleur"],["remplacementMoteur","Moteur"],["autresModifications","Autres"]].map(([k,l])=>(
          <FField key={k} label={l}><input style={S.inp} value={form[k]||""} onChange={e=>F(k,e.target.value)}/></FField>
        ))}</FG2>
      </Modal>}
      {detteId&&(()=>{const ch=data.chauffeurs.find(c=>c.id===detteId);const info=calcDette(ch);return(
        <div style={S.modal}><div style={{...S.mbox,maxWidth:420}}>
          <h3 style={S.mtitle}>💰 Dette — {ch?.nom} {ch?.prenom}</h3>
          {!info?<p style={{color:C.textL}}>Aucun contrat actif.</p>:(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[["Attendu",`${fmt(info.attendu)} HTG`],["Payé",`${fmt(info.totalP)} HTG`],["Dette",`${fmt(info.dette)} HTG`],["Paiements",`${info.nbP} jours`],["Fin contrat",info.ct.dateFin],["Journalier",`${fmt(info.ct.montantJournalier)} HTG`]].map(([l,v])=>(
                <div key={l} style={{background:"#f8fafc",padding:"9px 12px",borderRadius:8}}><div style={{fontSize:11,color:C.textM}}>{l}</div><div style={{fontSize:15,fontWeight:700}}>{v}</div></div>
              ))}
              {info.dette>0&&<div style={{gridColumn:"1/-1",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:10,color:C.danger,fontWeight:700}}>⚠️ Dette : {fmt(info.dette)} HTG</div>}
            </div>
          )}
          <div style={S.mact}><button style={S.bs} onClick={()=>setDetteId(null)}>Fermer</button></div>
        </div></div>
      );})()} 
      <div style={{...S.card,overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["Code","Nom Complet","Téléphone","CIN","Statut","Dette","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map(c=>{const info=calcDette(c);return(
              <tr key={c.id}>
                <td style={S.td}><span style={{...S.badge,background:"#f1f5f9",color:C.textM}}>{c.code||"—"}</span></td>
                <td style={S.td}><b>{c.nom} {c.prenom}</b></td>
                <td style={S.td}>{c.telephone||"—"}</td>
                <td style={S.td}>{c.cin||"—"}</td>
                <td style={S.td}><SBadge s={c.statut}/></td>
                <td style={S.td}>{info?<span style={{color:info.dette>0?C.danger:"#22c55e",fontWeight:700}}>{fmt(info.dette)} HTG</span>:"—"}</td>
                <td style={S.td}><div style={{display:"flex",gap:5}}>
                  <button style={S.bie} onClick={()=>{setForm(c);setEditing(c.id);setShowF(true);}}>✏️</button>
                  <button style={{...S.bie,background:"#fef3c7"}} onClick={()=>setDetteId(c.id)}>💰</button>
                </div></td>
              </tr>
            );})}
            {!filtered.length&&<EmptyRow cols={7}/>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════ VENTES ══════════════════════════════ */
function GVentes({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);const[viewId,setViewId]=useState(null);
  const[form,setForm]=useState({clientNom:"",clientTel:"",date:tod(),items:[],remise:0,modePaiement:"Espèces",statutPaiement:"Payé",montantVerse:"",notes:""});
  const[itemForm,setItemForm]=useState({produitId:"",type:"unites",quantite:1,palier:"prixUnite"});

  const PALIERS=[["prixUnite","Unité"],["prixTier3","x3 unités"],["prixTier6","x6 unités"],["prixTier12","x12 unités"],["prixCaisse1","1 Caisse"],["prixCaisse3Plus","3+ Caisses"]];

  const addItem=()=>{
    const p=data.produits.find(x=>x.id===itemForm.produitId);
    if(!p){showAlert("Sélectionner un produit","error");return;}
    const qte=Number(itemForm.quantite||1);
    const prix=Number(p[itemForm.palier]||0);
    const unite=itemForm.palier.includes("Caisse")?Number(p.unitesParCaisse||1):1;
    const totalUnites=qte*unite;
    const lineTotal=prix*qte;
    const coutTotal=Number(p.coutUnite||0)*totalUnites;
    const profit=lineTotal-coutTotal;
    const item={id:gid("li"),produitId:p.id,produitNom:p.nom,palier:itemForm.palier,palierLabel:PALIERS.find(x=>x[0]===itemForm.palier)?.[1],quantite:qte,totalUnites,prixUnitaire:prix,lineTotal,coutTotal,profit};
    setForm(f=>({...f,items:[...f.items,item]}));
    setItemForm({produitId:"",type:"unites",quantite:1,palier:"prixUnite"});
  };

  const calcTotals=()=>{
    const sub=form.items.reduce((s,i)=>s+i.lineTotal,0);
    const total=sub-Number(form.remise||0);
    const profitNet=form.items.reduce((s,i)=>s+i.profit,0)-Number(form.remise||0);
    const balance=total-Number(form.montantVerse||total);
    return{sub,total,profitNet,balance};
  };

  const save_=()=>{
    if(!form.items.length){showAlert("Ajouter au moins un produit","error");return;}
    const{sub,total,profitNet,balance}=calcTotals();
    mutate(d=>{
      const vente={...form,id:gid("vt"),numero:`FACT-${Date.now()}`,sous_total:sub,total,profitNet,balance,dateCreation:new Date().toISOString()};
      d.ventes=[...d.ventes,vente];
      // Mise à jour stock
      form.items.forEach(item=>{
        d.produits=d.produits.map(p=>p.id===item.produitId?{...p,stockUnites:Math.max(0,Number(p.stockUnites||0)-item.totalUnites)}:p);
        d.stockMovements=[...d.stockMovements,{id:gid("mv"),date:form.date,produitId:item.produitId,produitNom:item.produitNom,type:"Sortie (Vente)",quantite:-item.totalUnites,ref:vente.numero}];
      });
      return d;
    });
    showAlert("Vente enregistrée","success");setShowF(false);
    setForm({clientNom:"",clientTel:"",date:tod(),items:[],remise:0,modePaiement:"Espèces",statutPaiement:"Payé",montantVerse:"",notes:""});
  };

  const{sub,total,profitNet,balance}=calcTotals();
  const vente=data.ventes.find(v=>v.id===viewId);

  return(
    <div>
      <PageHeader title="🧾 Ventes" color={C.commerce} onAdd={()=>setShowF(true)} label="+ Nouvelle Vente"/>
      {showF&&(
        <div style={S.modal}><div style={{...S.mbox,maxWidth:720}}>
          <h3 style={S.mtitle}>🧾 Nouvelle Vente</h3>
          <SectionLabel c={C.commerce}>👥 Client</SectionLabel>
          <FG2>
            <FField label="Nom du Client"><input style={S.inp} value={form.clientNom} onChange={e=>setForm(f=>({...f,clientNom:e.target.value}))}/></FField>
            <FField label="Téléphone"><input style={S.inp} value={form.clientTel} onChange={e=>setForm(f=>({...f,clientTel:e.target.value}))}/></FField>
            <FField label="Date"><input style={S.inp} type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></FField>
            <FField label="Mode de Paiement"><select style={S.inp} value={form.modePaiement} onChange={e=>setForm(f=>({...f,modePaiement:e.target.value}))}><option>Espèces</option><option>MonCash</option><option>Natcash</option><option>Virement</option><option>Crédit</option></select></FField>
            <FField label="Statut Paiement"><select style={S.inp} value={form.statutPaiement} onChange={e=>setForm(f=>({...f,statutPaiement:e.target.value}))}><option>Payé</option><option>Partiel</option><option>Impayé</option></select></FField>
            <FField label="Montant Versé (HTG)"><input style={S.inp} type="number" value={form.montantVerse} onChange={e=>setForm(f=>({...f,montantVerse:e.target.value}))}/></FField>
          </FG2>
          <SectionLabel c={C.commerce}>📦 Ajouter Produit</SectionLabel>
          <div style={{background:"#f8fafc",borderRadius:10,padding:12,marginBottom:10}}>
            <div style={S.fg2}>
              <FField label="Produit"><select style={S.inp} value={itemForm.produitId} onChange={e=>setItemForm(f=>({...f,produitId:e.target.value}))}><option value="">-- Sélectionner --</option>{data.produits.map(p=><option key={p.id} value={p.id}>{p.nom} (Stock: {p.stockUnites||0})</option>)}</select></FField>
              <FField label="Palier de Prix"><select style={S.inp} value={itemForm.palier} onChange={e=>setItemForm(f=>({...f,palier:e.target.value}))}>{PALIERS.map(([k,l])=>{const p=data.produits.find(x=>x.id===itemForm.produitId);return<option key={k} value={k}>{l}{p?` — ${fmt(p[k]||0)} HTG`:""}</option>;})}</select></FField>
              <FField label="Quantité"><input style={S.inp} type="number" min="1" value={itemForm.quantite} onChange={e=>setItemForm(f=>({...f,quantite:e.target.value}))}/></FField>
            </div>
            <button style={{...S.bCommerce,fontSize:12}} onClick={addItem}>+ Ajouter à la facture</button>
          </div>
          {form.items.length>0&&(
            <div style={{overflowX:"auto",marginBottom:10}}>
              <table style={S.table}>
                <thead><tr><th style={S.th}>Produit</th><th style={S.th}>Palier</th><th style={S.th}>Qté</th><th style={S.th}>Unités</th><th style={S.th}>Prix</th><th style={S.th}>Total</th><th style={S.th}>Profit</th><th style={S.th}>✕</th></tr></thead>
                <tbody>{form.items.map((it,i)=>(
                  <tr key={it.id}><td style={S.td}>{it.produitNom}</td><td style={S.td}>{it.palierLabel}</td><td style={S.td}>{it.quantite}</td><td style={S.td}>{it.totalUnites}</td><td style={S.td}>{fmt(it.prixUnitaire)} HTG</td><td style={{...S.td,fontWeight:700,color:C.commerce}}>{fmt(it.lineTotal)} HTG</td><td style={{...S.td,color:"#10b981"}}>{fmt(it.profit)} HTG</td><td style={S.td}><button style={{...S.bid,padding:"3px 7px"}} onClick={()=>setForm(f=>({...f,items:f.items.filter((_,j)=>j!==i)}))}>✕</button></td></tr>
                ))}</tbody>
              </table>
            </div>
          )}
          <FG2>
            <FField label="Remise (HTG)"><input style={S.inp} type="number" value={form.remise} onChange={e=>setForm(f=>({...f,remise:e.target.value}))}/></FField>
          </FG2>
          <div style={{background:"#f0fdf4",borderRadius:10,padding:"10px 14px",marginBottom:10}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {[["Sous-total",`${fmt(sub)} HTG`],["Total",`${fmt(total)} HTG`],["Profit Net",`${fmt(profitNet)} HTG`]].map(([l,v])=>(
                <div key={l}><div style={{fontSize:11,color:C.textM}}>{l}</div><div style={{fontWeight:700,color:C.commerce}}>{v}</div></div>
              ))}
            </div>
          </div>
          <FField label="Notes"><textarea style={{...S.inp,height:50,resize:"vertical"}} value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></FField>
          <div style={S.mact}><button style={S.bs} onClick={()=>setShowF(false)}>Annuler</button><button style={{...S.bp,background:C.commerce}} onClick={save_}>💾 Enregistrer la Vente</button></div>
        </div></div>
      )}
      {vente&&(
        <div style={S.modal}><div style={{...S.mbox,maxWidth:520}}>
          <h3 style={S.mtitle}>🧾 {vente.numero}</h3>
          <div style={{fontSize:13,color:C.textM,marginBottom:10}}>{vente.date} · {vente.clientNom||"—"} · {vente.clientTel||""}</div>
          <div style={{overflowX:"auto"}}><table style={S.table}>
            <thead><tr><th style={S.th}>Produit</th><th style={S.th}>Qté</th><th style={S.th}>Prix</th><th style={S.th}>Total</th></tr></thead>
            <tbody>{(vente.items||[]).map(it=><tr key={it.id}><td style={S.td}>{it.produitNom}</td><td style={S.td}>{it.quantite}</td><td style={S.td}>{fmt(it.prixUnitaire)} HTG</td><td style={{...S.td,fontWeight:700}}>{fmt(it.lineTotal)} HTG</td></tr>)}</tbody>
          </table></div>
          <div style={{marginTop:10,fontSize:13}}><b>Total :</b> {fmt(vente.total)} HTG · <b>Profit :</b> {fmt(vente.profitNet)} HTG · <SBadge s={vente.statutPaiement||"Payé"}/></div>
          <div style={S.mact}><button style={S.bs} onClick={()=>setViewId(null)}>Fermer</button><button style={S.bp} onClick={()=>window.print()}>🖨️ Imprimer</button></div>
        </div></div>
      )}
      <div style={{...S.card,overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["N° Facture","Date","Client","Articles","Total","Profit","Statut","Actions"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {data.ventes.slice().reverse().map(v=>(
              <tr key={v.id}><td style={S.td}><span style={{...S.badge,background:C.commerceL,color:"#065f46"}}>{v.numero}</span></td><td style={S.td}>{v.date}</td><td style={S.td}>{v.clientNom||"—"}</td><td style={S.td}>{(v.items||[]).length} articles</td><td style={{...S.td,fontWeight:700,color:C.commerce}}>{fmt(v.total)} HTG</td><td style={{...S.td,color:"#10b981"}}>{fmt(v.profitNet)} HTG</td><td style={S.td}><SBadge s={v.statutPaiement||"Payé"}/></td><td style={S.td}><button style={S.bie} onClick={()=>setViewId(v.id)}>👁️</button></td></tr>
            ))}
            {!data.ventes.length&&<EmptyRow cols={8}/>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════ ACHATS ══════════════════════════════ */
function GAchats({data,mutate,showAlert,session}){
  const[showF,setShowF]=useState(false);
  const[form,setForm]=useState({numero:"",fournisseurNom:"",fournisseurTel:"",date:tod(),datelivraison:"",statutLivraison:"Commandé",statutPaiement:"Payé",items:[],notes:""});
  const[itemForm,setItemForm]=useState({produitId:"",nbCaisses:1});

  const addItem=()=>{
    const p=data.produits.find(x=>x.id===itemForm.produitId);
    if(!p){showAlert("Sélectionner un produit","error");return;}
    const caisses=Number(itemForm.nbCaisses||1);
    const totalUnites=caisses*Number(p.unitesParCaisse||1);
    const coutCaisse=Number(p.prixAchatCaisse||0)+Number(p.fraisCaisse||0);
    const totalCout=caisses*coutCaisse;
    setForm(f=>({...f,items:[...f.items,{id:gid("ai"),produitId:p.id,produitNom:p.nom,caisses,totalUnites,coutCaisse,totalCout}]}));
    setItemForm({produitId:"",nbCaisses:1});
  };

  const totalGeneral=form.items.reduce((s,i)=>s+i.totalCout,0);

  const save_=()=>{
    if(!form.items.length){showAlert("Ajouter au moins un produit","error");return;}
    mutate(d=>{
      const achat={...form,id:gid("ach"),numero:form.numero||`ACH-${Date.now()}`,totalGeneral,dateCreation:new Date().toISOString()};
      d.achats=[...d.achats,achat];
      if(form.statutLivraison==="Livré"){
        form.items.forEach(it=>{
          d.produits=d.produits.map(p=>p.id===it.produitId?{...p,stockUnites:Number(p.stockUnites||0)+it.totalUnites}:p);
          d.stockMovements=[...d.stockMovements,{id:gid("mv"),date:form.date,produitId:it.produitId,produitNom:it.produitNom,type:"Entrée (Achat)",quantite:it.totalUnites,ref:achat.numero}];
        });
      }
      return d;
    });
    showAlert("Achat enregistré","success");setShowF(false);
    setForm({numero:"",fournisseurNom:"",fournisseurTel:"",date:tod(),datelivraison:"",statutLivraison:"Commandé",statutPaiement:"Payé",items:[],notes:""});
  };

  return(
    <div>
      <PageHeader title="🛒 Achats Fournisseurs" color={C.commerce} onAdd={()=>setShowF(true)} label="+ Nouvel Achat"/>
      {showF&&(
        <div style={S.modal}><div style={{...S.mbox,maxWidth:700}}>
          <h3 style={S.mtitle}>🛒 Nouvel Achat Fournisseur</h3>
          <FG2>
            <FField label="N° Commande"><input style={S.inp} value={form.numero} onChange={e=>setForm(f=>({...f,numero:e.target.value}))}/></FField>
            <FField label="Fournisseur"><input style={S.inp} value={form.fournisseurNom} onChange={e=>setForm(f=>({...f,fournisseurNom:e.target.value}))}/></FField>
            <FField label="Téléphone Fournisseur"><input style={S.inp} value={form.fournisseurTel} onChange={e=>setForm(f=>({...f,fournisseurTel:e.target.value}))}/></FField>
            <FField label="Date Commande"><input style={S.inp} type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></FField>
            <FField label="Date Livraison Prévue"><input style={S.inp} type="date" value={form.datelivraison} onChange={e=>setForm(f=>({...f,datelivraison:e.target.value}))}/></FField>
            <FField label="Statut Livraison"><select style={S.inp} value={form.statutLivraison} onChange={e=>setForm(f=>({...f,statutLivraison:e.target.value}))}><option>Commandé</option><option>En transit</option><option>Livré</option></select></FField>
            <FField label="Statut Paiement"><select style={S.inp} value={form.statutPaiement} onChange={e=>setForm(f=>({...f,statutPaiement:e.target.value}))}><option>Payé</option><option>Partiel</option><option>Impayé</option></select></FField>
          </FG2>
          <SectionLabel c={C.commerce}>📦 Produits Commandés</SectionLabel>
          <div style={{background:"#f8fafc",borderRadius:10,padding:12,marginBottom:10}}>
            <div style={S.fg2}>
              <FField label="Produit"><select style={S.inp} value={itemForm.produitId} onChange={e=>setItemForm(f=>({...f,produitId:e.target.value}))}><option value="">-- Sélectionner --</option>{data.produits.map(p=><option key={p.id} value={p.id}>{p.nom}</option>)}</select></FField>
              <FField label="Nombre de Caisses"><input style={S.inp} type="number" min="1" value={itemForm.nbCaisses} onChange={e=>setItemForm(f=>({...f,nbCaisses:e.target.value}))}/></FField>
            </div>
            <button style={{...S.bCommerce,fontSize:12}} onClick={addItem}>+ Ajouter</button>
          </div>
          {form.items.length>0&&(
            <div style={{overflowX:"auto",marginBottom:10}}>
              <table style={S.table}>
                <thead><tr><th style={S.th}>Produit</th><th style={S.th}>Caisses</th><th style={S.th}>Unités</th><th style={S.th}>Coût/Caisse</th><th style={S.th}>Total</th><th style={S.th}>✕</th></tr></thead>
                <tbody>{form.items.map((it,i)=><tr key={it.id}><td style={S.td}>{it.produitNom}</td><td style={S.td}>{it.caisses}</td><td style={S.td}>{it.totalUnites}</td><td style={S.td}>{fmt(it.coutCaisse)} HTG</td><td style={{...S.td,fontWeight:700,color:C.danger}}>{fmt(it.totalCout)} HTG</td><td style={S.td}><button style={{...S.bid,padding:"3px 7px"}} onClick={()=>setForm(f=>({...f,items:f.items.filter((_,j)=>j!==i)}))}>✕</button></td></tr>)}</tbody>
              </table>
            </div>
          )}
          <div style={{background:"#fef2f2",borderRadius:8,padding:"10px 14px",marginBottom:10,fontWeight:700,color:C.danger}}>Total Général : {fmt(totalGeneral)} HTG</div>
          <InfoBox c="#fef3c7">Si statut "Livré" : le stock sera mis à jour automatiquement.</InfoBox>
          <FField label="Notes"><textarea style={{...S.inp,height:50,resize:"vertical"}} value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></FField>
          <div style={S.mact}><button style={S.bs} onClick={()=>setShowF(false)}>Annuler</button><button style={{...S.bp,background:C.commerce}} onClick={save_}>💾 Enregistrer</button></div>
        </div></div>
      )}
      <div style={{...S.card,overflowX:"auto"}}>
        <table style={S.table}>
          <thead><tr>{["N°","Date","Fournisseur","Articles","Total","Livraison","Paiement"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {data.achats.slice().reverse().map(a=>(
              <tr key={a.id}><td style={S.td}><span style={{...S.badge,background:"#fef3c7",color:"#92400e"}}>{a.numero}</span></td><td style={S.td}>{a.date}</td><td style={S.td}>{a.fournisseurNom||"—"}</td><td style={S.td}>{(a.items||[]).length} produits</td><td style={{...S.td,fontWeight:700,color:C.danger}}>{fmt(a.totalGeneral)} HTG</td><td style={S.td}><SBadge s={a.statutLivraison||"Commandé"}/></td><td style={S.td}><SBadge s={a.statutPaiement||"Payé"}/></td></tr>
            ))}
            {!data.achats.length&&<EmptyRow cols={7}/>}
          </tbody>
        </table>
      </div>
    </div>
  );

/* ══════════════════════════════ CAISSE ══════════════════════════════ */
function Caisse({data}){
  const totalEncTaxi=data.transactions.reduce((s,t)=>s+Number(t.montantPaye||0),0);
  const totalDepTaxi=data.depenses.reduce((s,d)=>s+Number(d.montant||0),0);
  const totalPertes=data.pertes.reduce((s,p)=>s+Number(p.coutEstime||0),0);
  const totalVentes=data.ventes.reduce((s,v)=>s+Number(v.total||0),0);
  const profitCommerce=data.ventes.reduce((s,v)=>s+Number(v.profitNet||0),0);
  const totalAchats=data.achats.reduce((s,a)=>s+Number(a.totalGeneral||0),0);
  const beneficeTaxi=totalEncTaxi-totalDepTaxi-totalPertes;
  const beneficeTotal=beneficeTaxi+profitCommerce;
  const today=tod();
  const cards=[
    {l:"Encaissé Taxi",v:totalEncTaxi,c:C.taxi},{l:"Dépenses Taxi",v:totalDepTaxi,c:C.danger},
    {l:"Pertes Taxi",v:totalPertes,c:C.danger},{l:"Bénéfice Taxi",v:beneficeTaxi,c:beneficeTaxi>=0?"#10b981":C.danger},
    {l:"Chiffre d'Affaires Commerce",v:totalVentes,c:C.commerce},{l:"Coût Achats Commerce",v:totalAchats,c:C.danger},
    {l:"Profit Commerce",v:profitCommerce,c:profitCommerce>=0?"#10b981":C.danger},
    {l:"BÉNÉFICE TOTAL NET",v:beneficeTotal,c:beneficeTotal>=0?"#10b981":C.danger},
  ];
  const parMoisTaxi={};data.transactions.forEach(t=>{const m=t.date?.slice(0,7);if(m)parMoisTaxi[m]=(parMoisTaxi[m]||0)+Number(t.montantPaye||0);});
  const parMoisVentes={};data.ventes.forEach(v=>{const m=v.date?.slice(0,7);if(m)parMoisVentes[m]=(parMoisVentes[m]||0)+Number(v.total||0);});
  const mois=[...new Set([...Object.keys(parMoisTaxi),...Object.keys(parMoisVentes)])].sort().slice(-6);
  return(
    <div>
      <h2 style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:14}}>🏦 Caisse & Flux Financier</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:12,marginBottom:14}}>
        {cards.map((c,i)=>(
          <div key={i} style={{...S.card,borderLeft:`4px solid ${c.c}`}}><div style={{fontSize:11,color:C.textM}}>{c.l}</div><div style={{fontSize:18,fontWeight:800,color:c.c}}>{fmt(c.v)} HTG</div></div>
        ))}
      </div>
      {mois.length>0&&(
        <div style={{...S.card,overflowX:"auto"}}>
          <div style={{fontWeight:700,marginBottom:10}}>📊 Flux Mensuel</div>
          <table style={S.table}>
            <thead><tr><th style={S.th}>Mois</th><th style={S.th}>Taxi Encaissé</th><th style={S.th}>Ventes Commerce</th><th style={S.th}>Total Entrées</th></tr></thead>
            <tbody>{mois.map(m=>{const t=parMoisTaxi[m]||0,v=parMoisVentes[m]||0;return(
              <tr key={m}><td style={S.td}><b>{m}</b></td><td style={{...S.td,color:C.taxi,fontWeight:700}}>{fmt(t)} HTG</td><td style={{...S.td,color:C.commerce,fontWeight:700}}>{fmt(v)} HTG</td><td style={{...S.td,fontWeight:700}}>{fmt(t+v)} HTG</td></tr>
            );})}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

        <FG2>
          <FField label="Nom du Module *"><input style={S.inp} value={form.nom} onChange={e=>F("nom",e.target.value)}/></FField>
          <FField label="Icône (emoji)"><input style={S.inp} value={form.icon} onChange={e=>F("icon",e.target.value)}/></FField>
        </FG2>
        <FField label="Description"><input style={S.inp} value={form.description||""} onChange={e=>F("description",e.target.value)}/></FField>
        <Sp h={12}/>
        <SectionLabel c={C.primary}>📋 Champs du Module</SectionLabel>
        <div style={{background:"#f8fafc",borderRadius:10,padding:12,marginBottom:10}}>
          <div style={S.fg2}>
            <FField label="Nom du Champ"><input style={S.inp} value={champForm.label} onChange={e=>setChampForm(f=>({...f,label:e.target.value}))}/></FField>
            <FField label="Type"><select style={S.inp} value={champForm.type} onChange={e=>setChampForm(f=>({...f,type:e.target.value}))}><option value="text">Texte</option><option value="number">Nombre</option><option value="date">Date</option><option value="select">Liste choix</option></select></FField>
          </div>
          <button style={{...S.bp,fontSize:12,background:C.primary}} onClick={addChamp}>+ Ajouter Champ</button>
        </div>
        {form.champs.length>0&&(
          <div>{form.champs.map((c,i)=>(
            <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:"#f0f9ff",borderRadius:8,marginBottom:6}}>
              <span style={{fontSize:13}}><b>{c.label}</b> <span style={{color:C.textL}}>({c.type})</span></span>
              <button style={{...S.bid,padding:"3px 8px",fontSize:12}} onClick={()=>setForm(f=>({...f,champs:f.champs.filter((_,j)=>j!==i)}))}>✕</button>
            </div>
          ))}</div>
        )}
      </Modal>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
        {(data.modules||[]).map(m=>(
          <div key={m.id} style={{...S.card,borderTop:`4px solid ${C.primary}`}}>
            <div style={{fontSize:28,marginBottom:6}}>{m.icon}</div>
            <div style={{fontWeight:800,fontSize:15,color:C.text}}>{m.nom}</div>
            <div style={{fontSize:12,color:C.textM,marginBottom:8}}>{m.description}</div>
            <div style={{fontSize:12,color:C.textL}}>{(m.champs||[]).length} champs · {(m.enregistrements||[]).length} enregistrements</div>
            <div style={{marginTop:10,display:"flex",gap:8}}>
              <button style={{...S.bs,fontSize:12,padding:"6px 12px"}} onClick={()=>mutate(d=>{d.modules=d.modules.filter(x=>x.id!==m.id);return d;})}>🗑️ Supprimer</button>
            </div>
          </div>
        ))}
        {!(data.modules||[]).length&&<div style={{...S.card,textAlign:"center",color:C.textL,gridColumn:"1/-1",padding:40}}>🧩 Aucun module créé. Cliquez sur "+ Nouveau Module" pour commencer.</div>}
      </div>
    </div>
  );
}

function ExtensionView({module:m}){
  const[data2,setData2]=useState(()=>({items:(m.enregistrements||[])}));
  // Extension modules: lecture seule dans cette vue simplifiée
  return(
    <div>
      <h2 style={{fontSize:18,fontWeight:800,margin:"0 0 14px"}}>{m.icon} {m.nom}</h2>
      <InfoBox c="#eef2ff">Module personnalisé — {(m.champs||[]).length} champs configurés · {(m.enregistrements||[]).length} enregistrements</InfoBox>
      <Sp h={10}/>
      <div style={S.card}><p style={{color:C.textL,fontSize:13}}>Les données de ce module sont enregistrées dans le système RTB-M. Gérez ce module via ⚙️ Extensions.</p></div>
    </div>
  );
}

/* ══════════════════════════════ PARAMÈTRES ══════════════════════════════ */
function Parametres({session,data,mutate,showAlert,onClose,setSession}){
  const[tab,setTab]=useState("profil");
  const[nom,setNom]=useState(session.nom);const[username,setUsername]=useState(session.username);
  const[oldPwd,setOldPwd]=useState("");const[newPwd,setNewPwd]=useState("");const[confPwd,setConfPwd]=useState("");
  const[editUser,setEditUser]=useState(null);const[euNom,setEuNom]=useState("");const[euUser,setEuUser]=useState("");const[euPwd,setEuPwd]=useState("");const[euRole,setEuRole]=useState("agent");
  const tb2=(t)=>({padding:"9px 14px",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,borderBottom:tab===t?`2px solid ${C.primary}`:"2px solid transparent",color:tab===t?C.primary:C.textM,background:"transparent"});
  const saveProfil=()=>{if(!nom||!username){showAlert("Requis","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,nom,username}:u);return d;});setSession(s=>({...s,nom,username}));showAlert("Profil mis à jour","success");};
  const savePwd=()=>{const usr=data.users.find(u=>u.id===session.id);if(usr.password!==oldPwd){showAlert("Ancien mot de passe incorrect","error");return;}if(newPwd.length<6){showAlert("Min 6 caractères","error");return;}if(newPwd!==confPwd){showAlert("Ne correspondent pas","error");return;}mutate(d=>{d.users=d.users.map(u=>u.id===session.id?{...u,password:newPwd}:u);return d;});setOldPwd("");setNewPwd("");setConfPwd("");showAlert("Mot de passe modifié","success");};
  return(
    <div style={S.modal}><div style={{...S.mbox,maxWidth:480}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={{...S.mtitle,margin:0}}>⚙️ Paramètres</h3>
        <button style={{background:"transparent",border:"none",fontSize:20,cursor:"pointer",color:C.textM}} onClick={onClose}>✕</button>
      </div>
      <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,marginBottom:16}}>
        <button style={tb2("profil")} onClick={()=>setTab("profil")}>👤 Profil</button>
        <button style={tb2("pwd")} onClick={()=>setTab("pwd")}>🔑 Mot de passe</button>
        {session.role==="superadmin"&&<button style={tb2("users")} onClick={()=>setTab("users")}>👥 Utilisateurs</button>}
      </div>
      {tab==="profil"&&(<div>
        <div style={S.fg1}><label style={S.lbl}>Nom complet</label><input style={S.inp} value={nom} onChange={e=>setNom(e.target.value)}/></div>
        <div style={S.fg1}><label style={S.lbl}>Nom d'utilisateur</label><input style={S.inp} value={username} onChange={e=>setUsername(e.target.value)}/></div>
        <InfoBox c="#f8fafc">Rôle : <b style={{color:C.primary}}>{session.role==="superadmin"?"Super Admin":"Agent"}</b></InfoBox>
        <Sp h={12}/><button style={S.bp} onClick={saveProfil}>💾 Enregistrer</button>
      </div>)}
      {tab==="pwd"&&(<div>
        <div style={S.fg1}><label style={S.lbl}>Ancien mot de passe</label><input style={S.inp} type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)}/></div>
        <div style={S.fg1}><label style={S.lbl}>Nouveau mot de passe</label><input style={S.inp} type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)}/></div>
        <div style={S.fg1}><label style={S.lbl}>Confirmer</label><input style={S.inp} type="password" value={confPwd} onChange={e=>setConfPwd(e.target.value)}/></div>
        {newPwd&&confPwd&&newPwd!==confPwd&&<p style={{color:C.danger,fontSize:12,marginBottom:8}}>⚠ Ne correspondent pas</p>}
        <button style={S.bp} onClick={savePwd}>🔑 Changer</button>
      </div>)}
      {tab==="users"&&session.role==="superadmin"&&(<div>
        {editUser?(
          <div>
            <div style={{fontWeight:700,color:C.primary,marginBottom:10,fontSize:13}}>✏️ {editUser.nom}</div>
            <FG2>
              <FField label="Nom"><input style={S.inp} value={euNom} onChange={e=>setEuNom(e.target.value)}/></FField>
              <FField label="Username"><input style={S.inp} value={euUser} onChange={e=>setEuUser(e.target.value)}/></FField>
              <FField label="Nouveau mot de passe (optionnel)"><input style={S.inp} type="password" value={euPwd} onChange={e=>setEuPwd(e.target.value)}/></FField>
              <FField label="Rôle"><select style={S.inp} value={euRole} onChange={e=>setEuRole(e.target.value)}><option value="agent">Agent</option><option value="superadmin">Super Admin</option></select></FField>
            </FG2>
            <div style={{display:"flex",gap:10}}><button style={S.bs} onClick={()=>setEditUser(null)}>Annuler</button><button style={S.bp} onClick={()=>{mutate(d=>{d.users=d.users.map(u=>u.id===editUser.id?{...u,nom:euNom,username:euUser,role:euRole,...(euPwd?{password:euPwd}:{})}:u);return d;});showAlert("Modifié","success");setEditUser(null);}}>💾 Enregistrer</button></div>
          </div>
        ):(
          <div>{data.users.map(u=>(
            <div key={u.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 11px",borderRadius:9,background:"#f8fafc",marginBottom:7}}>
              <div><div style={{fontWeight:700,fontSize:13}}>{u.nom}</div><div style={{fontSize:11,color:C.textM}}>@{u.username} · {u.role==="superadmin"?"Super Admin":"Agent"} · <span style={{color:u.actif?"#22c55e":C.danger}}>{u.actif?"Actif":"Inactif"}</span></div></div>
              <div style={{display:"flex",gap:5}}>
                <button style={S.bie} onClick={()=>{setEditUser(u);setEuNom(u.nom);setEuUser(u.username);setEuPwd("");setEuRole(u.role);}}>✏️</button>
                <button style={{...S.bie,background:u.actif?"#fef2f2":"#f0fdf4"}} onClick={()=>mutate(d=>{d.users=d.users.map(x=>x.id===u.id?{...x,actif:!x.actif}:x);return d;})}>{u.actif?"🔒":"🔓"}</button>
              </div>
            </div>
          ))}</div>
        )}
      </div>)}
      <div style={S.mact}><button style={S.bs} onClick={onClose}>Fermer</button></div>
    </div></div>
  );
}

/* ══════════════════════════════ SHARED UI ══════════════════════════════ */
function PageHeader({title,color,onAdd,label}){
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <h2 style={{fontSize:18,fontWeight:800,color:color||C.text,margin:0}}>{title}</h2>
      {onAdd&&<button style={{...S.bp,background:color||C.primary}} onClick={onAdd}>{label||"+ Ajouter"}</button>}
    </div>
  );
}
function StatCard({label,val,color}){
  return(
    <div style={{...S.card,borderLeft:`4px solid ${color}`,marginBottom:12}}>
      <div style={{fontSize:12,color:C.textM}}>{label}</div>
      <div style={{fontSize:22,fontWeight:800,color}}>{val}</div>
    </div>
  );
}
function Modal({title,children,onClose,onSave}){
  return(
    <div style={S.modal}><div style={S.mbox}>
      <h3 style={S.mtitle}>{title}</h3>
      {children}
      <div style={S.mact}><button style={S.bs} onClick={onClose}>Annuler</button><button style={S.bp} onClick={onSave}>💾 Enregistrer</button></div>
    </div></div>
  );
}
function FG2({children}){return <div style={S.fg2}>{children}</div>;}
function FField({label,children}){return <div><label style={S.lbl}>{label}</label>{children}</div>;}
function SectionLabel({c,children}){return <div style={{fontWeight:700,color:c||C.primary,fontSize:12,margin:"12px 0 8px",paddingBottom:4,borderBottom:`1px solid ${C.border}`}}>{children}</div>;}
function InfoBox({c,children}){return <div style={{background:c||"#f0f9ff",borderRadius:8,padding:"9px 12px",fontSize:13,marginBottom:8}}>{children}</div>;}
function EmptyRow({cols}){return <tr><td colSpan={cols} style={{...S.td,textAlign:"center",color:C.textL,padding:24}}>Aucun enregistrement</td></tr>;}
function RowActions({onEdit,onDel}){return <div style={{display:"flex",gap:5}}><button style={S.bie} onClick={onEdit}>✏️</button>{onDel&&<button style={S.bid} onClick={onDel}>🗑️</button>}</div>;}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
